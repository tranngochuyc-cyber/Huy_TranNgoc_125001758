async function loadCommunity(g){const root=document.querySelector(`[data-community-game="${g.id}"]`);if(!root||!communityReady())return;try{const client=await communityClient();const [reviews,topics]=await Promise.all([client.from('reviews').select('*').eq('game_id',g.id).order('created_at',{ascending:false}).limit(30),client.from('topics').select('*').eq('game_id',g.id).order('created_at',{ascending:false}).limit(30)]);if(reviews.error||topics.error)throw Error('Chưa tải được thảo luận. Vui lòng thử lại sau.');if(!root.isConnected)return;root.querySelector('[data-community-reviews]').innerHTML=reviews.data.map(r=>`<article class="v8-post"><strong>${esc(r.display_name)} · ${'★'.repeat(Math.max(1,Math.min(5,Number(r.rating))))} · ${r.rating}/5</strong><small>${r.hours} giờ tự khai · ${new Date(r.created_at).toLocaleDateString('vi-VN')}</small>${r.spoiler?`<details><summary>Có tiết lộ nội dung</summary><p>${esc(r.body)}</p></details>`:`<p>${esc(r.body)}</p>`}</article>`).join('')||'<p>Chưa có đánh giá. Góc nhìn đầu tiên có thể là của bạn.</p>';root.querySelector('[data-community-topics]').innerHTML=topics.data.map(t=>`<details class="v8-post"><summary>${esc(t.title)}</summary><small>${esc(t.display_name)}</small>${t.spoiler?`<details><summary>Có tiết lộ nội dung</summary><p>${esc(t.body)}</p></details>`:`<p>${esc(t.body)}</p>`}<button data-community-replies="${t.id}">Xem trả lời</button><div id="replies-${t.id}"></div><form data-community="reply" data-topic="${t.id}"><label>Trả lời<textarea name="body" minlength="3" maxlength="2000" required></textarea></label><button class="outline-button">Gửi trả lời</button><p class="form-feedback" role="status"></p></form></details>`).join('')||'<p>Chưa có chủ đề. Hãy bắt đầu bằng một câu hỏi cụ thể.</p>';}catch(e){root.querySelectorAll('[aria-live]').forEach(n=>n.textContent=e.message);}}
document.addEventListener('submit',async e=>{const f=e.target,kind=f.dataset.community;if(!kind)return;e.preventDefault();const feedback=f.querySelector('.form-feedback'),b=Object.fromEntries(new FormData(f));try{const c=await communityClient();if(kind==='email'){const {error}=await c.auth.signInWithOtp({email:b.email,options:{emailRedirectTo:location.origin+(window.INDIEVERSE_BASE||'')+'/login'}});if(error)throw error;feedback.textContent='Kiểm tra email để mở liên kết đăng nhập.';return;}const {data:{user},error:authError}=await c.auth.getUser();if(authError||!user)throw Error('Vui lòng đăng nhập trước khi đăng bài.');const row={user_id:user.id,display_name:state.profile.name,body:b.body};let table;if(kind==='review'){table='reviews';Object.assign(row,{game_id:Number(f.dataset.game),rating:Number(b.rating),hours:Number(b.hours),spoiler:!!b.spoiler});}else if(kind==='topic'){table='topics';Object.assign(row,{game_id:Number(f.dataset.game),title:b.title,spoiler:!!b.spoiler});}else{table='replies';row.topic_id=f.dataset.topic;}const {error}=await c.from(table).insert(row);if(error)throw error;feedback.textContent='Đã đăng công khai.';f.reset();if(f.dataset.game)await loadCommunity(catalog.games.find(g=>g.id===Number(f.dataset.game)));else document.querySelector(`[data-community-replies="${f.dataset.topic}"]`)?.click();}catch(e){feedback.textContent=e.message||'Không thể gửi. Vui lòng thử lại.';}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.hasAttribute('data-community-steam')){const u=new URL(INDIEVERSE_COMMUNITY.steamLoginUrl);if(u.protocol!=='https:')throw Error('Cổng Steam phải dùng HTTPS.');location.assign(u.href);return;}if(b.hasAttribute('data-community-google')){const c=await communityClient(),{error}=await c.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+(window.INDIEVERSE_BASE||'')+'/login'}});if(error)throw error;}if(b.hasAttribute('data-community-logout')){const c=await communityClient();await c.auth.signOut();toast('Đã đăng xuất.');}if(b.dataset.communityReplies){const c=await communityClient(),{data,error}=await c.from('replies').select('*').eq('topic_id',b.dataset.communityReplies).order('created_at').limit(100);if(error)throw error;document.getElementById('replies-'+b.dataset.communityReplies).innerHTML=data.map(r=>`<article class="v8-post"><strong>${esc(r.display_name)}</strong><p>${esc(r.body)}</p></article>`).join('')||'<p>Chưa có trả lời.</p>';}}catch(e){toast(e.message);}});

<script>
/* Module: review-perspectives.js */
/* Short editorial lenses. These are never presented as reviews by real players. */
(function(root){
  const split=text=>String(text||'').replace(/\s+/g,' ').trim().match(/[^.!?]+[.!?]+|[^.!?]+$/g)?.map(s=>s.trim()).filter(s=>s.length>=24)||[];
  const unique=xs=>[...new Set(xs.filter(Boolean))];
  const lensNames=['Điều gây tò mò','Trong lúc chơi','Chi tiết đáng nhớ','Trước khi chọn'];
  function sectionAngles(g,section,index){
    const own=unique(section.paragraphs.flatMap(split));
    const surrounding=unique(g.sections.filter((_,i)=>i!==index).flatMap(s=>s.paragraphs.flatMap(split)));
    const choices=[
      [own[0],own[1]||surrounding[index%surrounding.length]],
      [own[1]||own[0],own[2]||surrounding[(index+1)%surrounding.length]],
      [own[2]||own[0],own[3]||surrounding[(index+2)%surrounding.length]],
      [own[3]||own[1]||own[0],surrounding[(index+3)%surrounding.length]]
    ];
    return choices.map(([a,b],i)=>({title:lensNames[i]+' · '+section.title,body:unique([a,b]).join(' ')}));
  }
  function cards(g){
    const intro=split(g.lede)[0]||g.pitch;
    const end=split(g.verdict)[0]||g.verdict;
    const out=[
      {title:'Ấn tượng đầu',body:intro,stars:4,kind:'MỞ ĐẦU'},
      {title:'Khi đúng gu',body:g.fit,stars:5,kind:'HỢP GU'},
      {title:'Khi cần cân nhắc',body:g.caution,stars:1,kind:'ĐIỂM NGẠI'},
      {title:'Điều còn ở lại',body:end,stars:4,kind:'SAU CÙNG'}
    ];
    g.sections.forEach((s,i)=>sectionAngles(g,s,i).forEach((angle,j)=>out.push({
      title:angle.title,body:angle.body,stars:[4,5,3,2][j],kind:'GÓC '+(i+1).toString().padStart(2,'0')+' · '+(j+1)
    })));
    if(out.length!==20)throw Error('Game '+g.slug+' needs 20 editorial angles; got '+out.length);
    const used=new Set();
    return out.map((r,i)=>{let body=r.body;const group=i===2||i===3?3:Math.max(0,Math.floor((i-4)/4))%4;const related=g.sections[group];if(body.length<95){const extra=split(related.paragraphs.join(' ')).find(s=>!body.includes(s));if(extra)body+=' '+extra;}for(let step=0;used.has(body)&&step<4;step++){const next=g.sections[(group+step+1)%g.sections.length],other=split(next.paragraphs[0])[0]||next.title;body=r.body+' '+other;}used.add(body);return {...r,body,id:i+1};});
  }
  function render(g,esc){const rows=cards(g);return `<section class="iv-lenses" id="reader-perspectives" data-visible="6" data-stars="all"><div class="iv-lenses-head"><div><span class="eyebrow">20 GÓC NHÌN / ${esc(g.name)}</span><h2>Đọc nhanh trước khi chơi.</h2><p>20 nhận định ngắn do bàn biên tập Review Game viết từ bài phân tích của chính game này. Đây không phải đánh giá của 20 người chơi.</p></div><a href="https://store.steampowered.com/app/${g.app}/#app_reviews_hash" target="_blank" rel="noopener">Đánh giá người chơi thật trên Steam ↗</a></div><div class="iv-lenses-scale"><strong>Sao hợp gu</strong><span>1 = nên cân nhắc kỹ · 5 = rất hợp với góc nhìn này. Không phải điểm chất lượng hay điểm cộng đồng.</span></div><div class="iv-lenses-filter" role="group" aria-label="Lọc góc nhìn theo số sao">${[['all','Tất cả'],[5,'5 sao'],[4,'4 sao'],[3,'3 sao'],[2,'2 sao'],[1,'1 sao']].map(([n,t])=>`<button type="button" data-lens-stars="${n}" aria-pressed="${n==='all'}">${t}</button>`).join('')}</div><div class="iv-lenses-grid">${rows.map((r,i)=>`<article class="iv-lens" data-stars="${r.stars}" ${i>=6?'hidden':''}><div class="iv-lens-head"><span class="iv-lens-avatar" aria-hidden="true">${String(r.id).padStart(2,'0')}</span><div><span class="iv-lens-author">Góc nhìn biên tập ${String(r.id).padStart(2,'0')}</span><small>${esc(r.kind)} · ${esc(g.name)}</small></div></div><div class="iv-lens-stars" aria-label="${r.stars} trên 5 sao hợp gu"><span>${'★'.repeat(r.stars)}</span><i>${'☆'.repeat(5-r.stars)}</i><b>${r.stars}/5</b></div><h3>${esc(r.title)}</h3><p>${esc(r.body)}</p></article>`).join('')}</div><button class="iv-lenses-more outline-button" type="button" data-lens-more>Xem thêm góc nhìn ↓</button><p class="iv-lenses-count" aria-live="polite">Đang xem 6 / 20 góc nhìn biên tập.</p></section>`;}
  if(typeof document!=='undefined')document.addEventListener('click',e=>{const button=e.target.closest('[data-lens-stars],[data-lens-more]');if(!button)return;const section=button.closest('.iv-lenses');if(!section)return;if(button.hasAttribute('data-lens-stars')){section.dataset.stars=button.dataset.lensStars;section.dataset.visible='6';}else section.dataset.visible=String(Number(section.dataset.visible)+6);const star=section.dataset.stars,matching=[...section.querySelectorAll('.iv-lens')].filter(card=>star==='all'||card.dataset.stars===star),limit=Number(section.dataset.visible);for(const card of section.querySelectorAll('.iv-lens'))card.hidden=true;matching.forEach((card,i)=>card.hidden=i>=limit);section.querySelectorAll('[data-lens-stars]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lensStars===star)));section.querySelector('[data-lens-more]').hidden=matching.length<=limit;section.querySelector('.iv-lenses-count').textContent='Đang xem '+Math.min(limit,matching.length)+' / '+matching.length+' góc nhìn biên tập.';});
  const api={cards,render};
  if(typeof module!=='undefined'&&module.exports)module.exports=api;else root.IVPerspectives=api;
})(typeof window!=='undefined'?window:globalThis);

</script>
<script>
/* Module: experience-v8.js */
/* Discovery tools store personal evidence locally; community data has a separate service. */
const V8=(()=>{
  const D=IVDiscovery,key='review-game-experience-v1';
  function read(){try{const x=JSON.parse(localStorage.getItem(key)||'{}');return {journal:[],dropped:{},routes:[],daily:{},...x};}catch{return {journal:[],dropped:{},routes:[],daily:{}};}}
  function write(x){localStorage.setItem(key,JSON.stringify(x));}
  const game=s=>catalog.games.find(g=>g.slug===s);
  const options=(pairs,v)=>pairs.map(([k,t])=>`<option value="${esc(k)}" ${String(v)===String(k)?'selected':''}>${esc(t)}</option>`).join('');
  function select(name,label,pairs,value=''){return `<label>${label}<select name="${name}">${options(pairs,value)}</select></label>`;}
  function tiles(ps){return `<div class="v8-grid">${ps.map(p=>{const g=game(p.slug);return g?`<article class="v8-card"><a href="${gu(g)}"><img src="${assetUrl(g.images?.[0]?.src)||img(g)}" alt="${esc(g.name)}" loading="lazy"></a><div><span class="eyebrow">${esc(g.country)} · ${p.minutes||'15'} PHÚT / PHIÊN GỢI Ý</span><h2><a href="${gu(g)}">${esc(g.name)}</a></h2><p>${esc(p.reason||g.fit)}</p><div class="button-row"><a href="${ru(g)}">Đọc nhận định ↗</a><a href="${g.source}" target="_blank" rel="noopener">Steam ↗</a></div></div></article>`:'';}).join('')}</div>`;}
  const tools=[['tonight','Tối nay chơi gì?','Một buổi chơi vừa với thời gian và tâm trạng.'],['dna','Game DNA','Nhìn lại điều khiến bạn muốn chơi tiếp.'],['mechanics','Mechanic Atlas','Theo một cơ chế qua nhiều thế giới.'],['preferences','Thích điều này, ngại điều kia','Giữ thứ bạn yêu, giảm điều khiến bạn bỏ cuộc.'],['rabbit-hole','Rabbit Hole','Rẽ theo hình ảnh, chiến đấu hoặc thế giới.'],['daily','15 phút khám phá','Một điểm hẹn nhỏ mỗi ngày.'],['radar','Comeback Radar','Lưu lý do tạm biệt, tìm lý do quay lại.'],['battle','Game Battle','Đặt hai game cạnh nhau theo từng tiêu chí.']];
  function nav(active){return `<nav class="v8-tabs" aria-label="Công cụ khám phá">${tools.map(([s,t])=>`<a href="/play/${s}" ${s===active?'aria-current="page"':''}>${t}</a>`).join('')}</nav>`;}
  function hub(){return `<section class="v8-launch"><div><span class="eyebrow">REVIEW GAME PLAY LAB</span><h2>Đừng chỉ tìm game.<br><em>Tìm cách bạn muốn chơi.</em></h2><p>Đi theo một cơ chế, một tâm trạng hay một điều bạn chưa từng thử.</p></div><div class="v8-tool-grid">${tools.map(([s,t,p],i)=>`<a href="/play/${s}"><small>0${i+1}</small><h3>${t} ↗</h3><p>${p}</p></a>`).join('')}</div></section>`;}
  function tonight(negative=false){const q=qp(),liked=q.get('like')||'hollow-knight';const ps=D.recommend(negative?{like:liked,positive:0,avoid:2,...Object.fromEntries(q)}:Object.fromEntries(q));return `<form data-v8="finder" class="v8-form">${negative?select('like','Game bạn thích',Object.keys(D.profiles).filter(game).map(s=>[s,game(s).name]),liked)+select('positive','Điều bạn muốn giữ',D.axes.map((a,i)=>[i,a]),q.get('positive')||0)+select('avoid','Điều bạn muốn ít hơn',[[-1,'Không giới hạn'],...D.axes.map((a,i)=>[i,a])],q.get('avoid')??2):select('minutes','Tôi có',[[15,'15 phút'],[30,'30 phút'],[60,'1 giờ'],[180,'3 giờ']],q.get('minutes')||60)+select('mood','Tâm trạng',[['','Bất kỳ'],['calm','Muốn thư giãn'],['curious','Muốn tò mò'],['intense','Muốn thử thách']],q.get('mood'))+select('energy','Mức tập trung',[['','Bất kỳ'],['low','Không muốn nghĩ nhiều'],['medium','Vừa phải'],['high','Sẵn sàng tập trung']],q.get('energy'))+select('activity','Muốn làm gì?',[['','Bất kỳ'],['explore','Khám phá'],['build','Xây dựng'],['story','Đọc câu chuyện'],['puzzle','Giải đố'],['combat','Hành động']],q.get('activity'))+select('coop','Chơi cùng',[['','Một mình / bất kỳ'],['yes','Cần co-op']],q.get('coop'))}<button class="primary">Tìm buổi chơi của tôi →</button></form><p class="v8-note">Đối chiếu ${Object.keys(D.profiles).length} hồ sơ được gắn đặc tính biên tập. Thời gian là gợi ý cho một phiên, không phải thời lượng hoàn thành. Hãy kiểm tra cách lưu game trước khi nghỉ.</p>${tiles(ps.slice(0,6))||'<p>Chưa có game khớp thời lượng. Thử nới thời gian.</p>'}`;}
  function dna(){const x=read(),library={};for(const [id,e]of Object.entries(state.library)){const g=catalog.games.find(g=>g.id===Number(id));if(g)library[g.slug]=e;}for(const j of x.journal)if(!library[j.slug])library[j.slug]={status:j.stage==='finished'?'completed':'playing'};for(const s of Object.keys(x.dropped))if(!library[s])library[s]={status:'paused'};const d=D.dna(library,x.journal,x.dropped);const identity=d.evidence?D.axes.map((a,i)=>({a,v:d.values[i]})).sort((a,b)=>b.v-a.v).slice(0,3).map(o=>o.a).join(' · '):'Chưa đủ dữ liệu';return `<div class="v8-dna"><div><span class="eyebrow">YOUR GAMING DNA</span><h2>${d.evidence?'Dấu vết của những lần chọn.':'DNA bắt đầu từ một lần chơi.'}</h2><strong>${identity}</strong><p>${d.evidence} game có dữ liệu đối chiếu. Đây là mô hình sở thích ước tính từ sổ tay, điểm chấm, thời gian ghi lại và lý do bỏ dở; không phải đánh giá tính cách.</p><a class="primary" href="/library">Mở sổ tay →</a><button class="outline-button" data-v8-share-dna>Chia sẻ DNA</button></div><div>${D.axes.map((a,i)=>`<div class="v8-meter"><label>${a}<b>${d.values[i]===null?'Chưa đủ dữ liệu':d.values[i]+' / 100'}</b></label><meter min="0" max="100" value="${d.values[i]||0}" aria-label="${a}"></meter></div>`).join('')}</div></div><p class="v8-note">Game đã hoàn thành có trọng số cao hơn game chỉ lưu. Chỉ các game đã có hồ sơ đặc tính mới được tính. Bạn có thể sửa hoặc xóa dữ liệu trong sổ tay.</p>`;}
  const defaultMechanics=[

  function atlas(){const mechanics=catalog.site?.mechanics||defaultMechanics;const id=qp().get('mechanic'),m=mechanics.find(m=>m[0]===id);return m?`<a href="/play/mechanics">← Tất cả cơ chế</a><h2>${m[1]}</h2><p>${m[2]}</p>${tiles(m[3].map((slug,i)=>({slug,reason:m[4][i]})))}`:`<div class="v8-tool-grid">${mechanics.map(([s,t,p,gs])=>`<a href="/play/mechanics?mechanic=${s}"><span class="eyebrow">${gs.length} CÁCH TRIỂN KHAI</span><h2>${t}</h2><p>${p}</p><b>Theo cơ chế →</b></a>`).join('')}</div>`;}
  function rabbit(){const slugs=(qp().get('path')||'hollow-knight').split(',').filter(s=>D.profiles[s]&&game(s)).slice(0,12);if(!slugs.length)slugs.push('hollow-knight');const current=slugs.at(-1),p=D.profiles[current];return `<div class="v8-route">${slugs.map((s,i)=>`<a href="/play/rabbit-hole?path=${slugs.slice(0,i+1).join(',')}">${esc(game(s).name)}</a>`).join('<span>→</span>')}</div><h2>Từ ${esc(game(current).name)}, bạn muốn rẽ đâu?</h2><div class="v8-grid">${[['Art',7,'Thử nghiệm'],['Combat',2,'Thử thách'],['World',0,'Khám phá']].map(([label,axis,detail])=>{const visual=label==='Art'?D.visualNeighbor(current,slugs):null;const next=visual?D.profiles[visual.slug]:Object.values(D.profiles).filter(n=>!slugs.includes(n.slug)&&game(n.slug)).sort((a,b)=>Math.abs(a.vector[axis]-p.vector[axis])-Math.abs(b.vector[axis]-p.vector[axis])||a.slug.localeCompare(b.slug))[0];return next?`<a class="v8-card" href="/play/rabbit-hole?path=${[...slugs,next.slug].join(',')}"><img src="${assetUrl(game(next.slug).images[0].src)}" alt="${esc(game(next.slug).name)}"><div><span>${label} / ${detail}</span><h3>${esc(game(next.slug).name)}</h3><p>${esc(visual?.shared.length?'Cùng ngôn ngữ hình ảnh: '+visual.shared.join(', '):next.reason)}</p></div></a>`:'';}).join('')}</div><p class="v8-note">Nhánh Art dùng nhãn phong cách do biên tập viên gắn cho 24 game; không phân tích hình ảnh tự động. Hành trình tối đa 12 điểm.</p><div class="button-row"><button class="primary" data-v8-route="${slugs.join(',')}">Lưu hành trình</button><button class="outline-button" data-action="copy-link">Chia sẻ đường đi</button><a href="/play/rabbit-hole">Bắt đầu lại</a></div><h3>Đường đi đã lưu</h3>${read().routes.map(r=>`<p><a href="/play/rabbit-hole?path=${esc(r.join(','))}">${r.map(s=>esc(game(s)?.name||s)).join(' → ')}</a></p>`).join('')||'<p>Chưa có hành trình.</p>'}`;}
  function daily(){const pool=catalog.games.filter(g=>g.steamMedia?.demos?.length),day=new Date().toISOString().slice(0,10);if(!pool.length)return '<p>Đang đối chiếu demo chính thức; chưa có demo được xác nhận.</p>';const g=pool[Math.floor(Date.now()/86400000)%pool.length],choice=read().daily[day];return `<section class="v8-daily"><img src="${assetUrl(g.images[0].src)}" alt="${esc(g.name)}"><div><span class="eyebrow">${day} / 15 PHÚT KHÁM PHÁ</span><h2>${esc(g.name)}</h2><ul><li>${esc(g.genre)}</li><li>${esc(g.fit)}</li><li>${esc(g.caution)}</li></ul><a class="primary" href="https://store.steampowered.com/app/${g.steamMedia.demos[0]}/" target="_blank" rel="noopener">Mở demo trên Steam ↗</a><p>Đặt 15 phút để thử; demo có thể dài hơn. Tình trạng demo theo lần kiểm tra nguồn gần nhất.</p><div class="button-row">${['Chơi tiếp','Muốn chơi','Không hợp'].map(t=>`<button class="outline-button" data-v8-daily="${t}" data-slug="${g.slug}" aria-pressed="${choice?.choice===t}">${t}</button>`).join('')}</div></div></section>`;}
  function radar(){const ds=Object.entries(read().dropped);return `<p>Lý do bạn dừng chơi được giữ lại để đọc bản cập nhật có mục tiêu. Chưa có nguồn xác nhận bản vá khắc phục từng lý do, nên Radar không tự kết luận game đã được sửa.</p>${ds.length?ds.map(([s,d])=>{const g=game(s);return g?`<article class="v8-panel"><h2>${esc(g.name)}</h2><p>Đã dừng vì: <strong>${esc(D.reasons[d.reason])}</strong></p><p>${esc(d.note)}</p><a class="primary" href="https://store.steampowered.com/news/app/${g.app}" target="_blank" rel="noopener">Đọc cập nhật từ nhà phát triển ↗</a><button class="outline-button" data-v8-return="${s}">Tôi đã quay lại</button></article>`:'';}).join(''):'<div class="v8-panel"><h2>Chưa có game đã bỏ dở.</h2><p>Mở một bài game và ghi lý do trong phần hành trình chơi.</p><a href="/games">Chọn game →</a></div>'}`;}
  function comparison(a,b){const x=D.profiles[a.slug],y=D.profiles[b.slug];if(!x||!y)return '<p class="v8-note">Bảng đặc tính biên tập hiện có cho 24 game được gắn hồ sơ. Hai bài đọc bên trên vẫn mở được với mọi game.</p>';return `<section class="v8-panel"><span class="eyebrow">ĐẶC TÍNH TRẢI NGHIỆM / BIÊN TẬP GẮN NHÃN</span><h2>Khác nhau ở đâu?</h2><div class="v8-compare-wrap"><table class="v8-compare"><thead><tr><th>Đặc tính</th><th>${esc(a.name)}</th><th>${esc(b.name)}</th></tr></thead><tbody>${D.axes.map((axis,i)=>`<tr><th>${esc(axis)}</th><td><meter min="0" max="5" value="${x.vector[i]}"></meter> ${x.vector[i]}/5</td><td><meter min="0" max="5" value="${y.vector[i]}"></meter> ${y.vector[i]}/5</td></tr>`).join('')}</tbody></table></div><p class="v8-note">Các số là nhãn mô tả do biên tập viên ước tính, không phải chất lượng, điểm cộng đồng hay tỷ lệ người chơi đã xác minh. Mức thử thách và grind càng cao nghĩa là trải nghiệm càng đòi hỏi ở khía cạnh đó.</p></section>`;}
  function battle(){const a=game(qp().get('a')||'hollow-knight'),b=game(qp().get('b')||'dead-cells');return `<form data-v8="battle" class="v8-form">${select('a','Game thứ nhất',catalog.games.map(g=>[g.slug,g.name]),a?.slug)}${select('b','Game thứ hai',catalog.games.map(g=>[g.slug,g.name]),b?.slug)}<button class="primary">Đặt cạnh nhau</button></form>${!a||!b||a===b?'<p>Chọn hai game khác nhau.</p>':`<div class="v8-grid">${[a,b].map(g=>`<article class="v8-panel"><h2>${esc(g.name)}</h2><p>${esc(g.fit)}</p><p>${esc(g.caution)}</p><a href="${ru(g)}">Đọc bài ↗</a></article>`).join('')}</div>${comparison(a,b)}<section class="v8-panel"><h2>Bình chọn theo trải nghiệm</h2><p>Chưa có dịch vụ bình chọn công khai được kết nối. Không có phần trăm hoặc lượt chơi được xác minh để hiển thị.</p>${['Khám phá','Chiến đấu','Câu chuyện','Chơi lại','Boss'].map(t=>`<p>${t} <span class="v8-note">— Chưa có phiếu</span></p>`).join('')}</section>`}`;}
  function page(section){const tool=tools.find(t=>t[0]===section);if(!tool)return notFound();return `${crumbs([['Góc indie','/features'],[tool[1]]])}<header class="v8-heading"><span class="eyebrow">PLAY LAB / ${tool[1]}</span><h1>${tool[1]}</h1><p>${tool[2]}</p></header>${nav(section)}${({'tonight':()=>tonight(),'preferences':()=>tonight(true),'dna':dna,'mechanics':atlas,'rabbit-hole':rabbit,'daily':daily,'radar':radar,'battle':battle}[section])()}`;}
  function journey(g){const x=read(),js=x.journal.filter(j=>j.slug===g.slug).sort((a,b)=>a.hours-b.hours||a.at.localeCompare(b.at)),d=x.dropped[g.slug];return `<section class="v8-panel" id="living-review"><span class="eyebrow">LIVING REVIEW / SỔ TAY RIÊNG</span><h2>Ấn tượng thay đổi theo giờ chơi.</h2><p>Ghi một mốc, nhìn lại sau một tuần. Các ghi chép này chỉ lưu trong trình duyệt của bạn.</p><form class="v8-form" data-v8="journal" data-slug="${g.slug}"><label>Số giờ đã chơi<input name="hours" type="number" min="0" max="100000" step="0.1" required></label>${select('stage','Mốc chơi',[['playing','Đang chơi'],['finished','Đã hoàn thành'],['revisit','Nhìn lại sau một thời gian']])}${select('focus','Điều bạn thích nhất ở mốc này',[[-1,'Chưa chọn'],...D.axes.map((a,i)=>[i,a])])}<label class="v8-wide">Cảm nhận ngắn<textarea name="text" minlength="3" maxlength="1000" required></textarea></label><button class="primary">Lưu mốc chơi</button></form><ol class="v8-timeline">${js.map(j=>`<li><strong>${j.hours} giờ · ${esc(j.stage==='finished'?'Đã hoàn thành':j.stage==='revisit'?'Nhìn lại':'Đang chơi')}</strong><time>${new Date(j.at).toLocaleDateString('vi-VN')}</time><p>${esc(j.text)}</p>${Number(j.focus)>=0&&j.focus!==undefined&&j.focus!==''?'<small>Điều thích nhất: '+esc(D.axes[Number(j.focus)]||'')+'</small>':''}<button data-v8-delete-journal="${j.id}">Xóa mốc</button></li>`).join('')}</ol><details><summary>${d?'Đã bỏ dở: '+esc(D.reasons[d.reason]):'Đã bỏ dở? Ghi lại lý do'}</summary><form class="v8-form" data-v8="drop" data-slug="${g.slug}">${select('reason','Lý do chính',Object.entries(D.reasons),d?.reason)}<label>Điều muốn thấy cải thiện<input name="note" maxlength="400" value="${esc(d?.note||'')}"></label><button class="outline-button">Lưu vào Comeback Radar</button></form></details></section>`;}
  document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.v8)return;e.preventDefault();const b=Object.fromEntries(new FormData(f)),x=read();try{if(f.dataset.v8==='finder'||f.dataset.v8==='battle'){go(route()+'?'+new URLSearchParams(b));return;}if(f.dataset.v8==='journal'){x.journal.push({id:crypto.randomUUID(),slug:f.dataset.slug,hours:Number(b.hours),stage:b.stage,focus:b.focus,text:b.text,at:new Date().toISOString()});}if(f.dataset.v8==='drop')x.dropped[f.dataset.slug]={...b,at:new Date().toISOString()};write(x);render();toast('Đã lưu trong trình duyệt của bạn.');}catch{toast('Không thể lưu. Kiểm tra quyền lưu trữ của trình duyệt.');}});
  document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const x=read();try{if(b.hasAttribute('data-v8-route')){const r=b.dataset.v8Route.split(',');if(!x.routes.some(p=>p.join(',')===r.join(',')))x.routes.push(r);}else if(b.dataset.v8DeleteJournal)x.journal=x.journal.filter(j=>j.id!==b.dataset.v8DeleteJournal);else if(b.dataset.v8Return)delete x.dropped[b.dataset.v8Return];else if(b.dataset.v8Daily){x.daily[new Date().toISOString().slice(0,10)]={slug:b.dataset.slug,choice:b.dataset.v8Daily};if(b.dataset.v8Daily==='Muốn chơi'){await api('/api/library',{gameId:game(b.dataset.slug).id,status:'wishlist',rating:null,note:''});state=await api('/api/state');}}else if(b.hasAttribute('data-v8-share-dna')){const text=document.querySelector('.v8-dna').innerText;await navigator.clipboard.writeText(text+'\n'+location.origin+(window.INDIEVERSE_BASE||'')+'/play/dna');toast('Đã sao chép DNA của bạn.');return;}else return;write(x);render();toast('Đã lưu.');}catch{toast('Không thể lưu hoặc sao chép. Vui lòng thử lại.');}});
  return {page,hub,journey};
})();

asianShelf=function(){const chart=catalog.steamChart;if(!chart?.rows?.length)return v8AsianShelf();const n=((Number(qp().get('hot'))||0)%chart.rows.length+chart.rows.length)%chart.rows.length;const row=chart.rows[n],g=catalog.games.find(g=>g.app===row.appid);const href=i=>{const p=qp();p.set('hot',i);return '/games?'+p.toString()+'#steam-hot';};return `<section class="asian-shelf" id="steam-hot"><div class="asian-shelf-heading"><div><span class="eyebrow">STEAM CHARTS / GAME TRONG DANH MỤC</span><h2>Đang được chơi.<br><em>Đáng để ghé qua.</em></h2><p>Ảnh chụp bảng Most Played của Steam ngày ${new Date(chart.rollupDate*1000).toLocaleDateString('vi-VN')}. Thứ hạng Steam toàn cầu, không phải bình chọn của Review Game.</p></div><div class="v8-hot-controls"><a href="${esc(href(n-1))}" aria-label="Game Steam trước">←</a><span>${n+1} / ${chart.rows.length}</span><a href="${esc(href(n+1))}" aria-label="Game Steam tiếp theo">→</a></div></div><div class="v8-daily"><a href="${g.source}" target="_blank" rel="noopener"><img style="width:100%;border-radius:14px" src="${assetUrl(g.images[0].src)}" alt="${esc(g.name)}"></a><div><span class="eyebrow">HẠNG #${row.rank} · TUẦN TRƯỚC #${row.last_week_rank||'—'}</span><h2>${esc(g.name)}</h2><p>${esc(g.fit)}</p><p>${row.peak_in_game.toLocaleString('vi-VN')} người chơi đồng thời cao nhất trong dữ liệu nguồn.</p><div class="button-row"><a class="primary" href="${g.source}" target="_blank" rel="noopener">Mở Steam ↗</a><a href="${gu(g)}">Hồ sơ game →</a></div><a href="${chart.source}" target="_blank" rel="noopener">Đối chiếu bảng Steam Charts ↗</a></div></div><div class="asian-chips"><a href="/games?country=${encodeURIComponent('Việt Nam')}#catalog-list">Game Việt Nam →</a><a href="/games?region=asia#catalog-list">Khám phá châu Á →</a></div></section>`;};
featuresPage=function(f){return f?v8Features(f):V8.hub()+v8Features();};

profilePage=function(){return `<div class="v8-account-link"><a class="primary" href="/login">Đăng nhập / Tạo tài khoản →</a><a href="/play/dna">Xem Gaming DNA ↗</a></div>`+v8Profile();};
const v8Detail=gameDetail,v8Review=reviewDetail;
gameDetail=function(g){return v8Detail(g)+IVPerspectives.render(g,esc)+V8.journey(g)+communityPanel(g);};
reviewDetail=function(g){const concise={...g,sections:g.sections.map(s=>({...s,paragraphs:s.paragraphs.flatMap(p=>p.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[p]).slice(0,Math.max(1,Math.ceil(s.paragraphs.flatMap(p=>p.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[p]).length/2))).map(p=>p.trim())}))};concise.wordCount=[concise.lede,...concise.sections.flatMap(s=>s.paragraphs),concise.verdict].join(' ').split(/\s+/).length;concise.readTime=Math.max(1,Math.ceil(concise.wordCount/220));return v8Review(concise)+IVPerspectives.render(g,esc)+V8.journey(g)+communityPanel(g)+`<section class="v8-steam"><h2>Tiếp tục với ${esc(g.name)}</h2><a class="primary" href="${g.source}" target="_blank" rel="noopener">Xem game trên Steam ↗</a></section>`;};

 for(const [k,v]of Object.entries(s.colors))document.documentElement.style.setProperty('--'+k,v);

 if(route()==='/')document.title=s.title+' — '+s.name;

 if(!s.communityEnabled)document.querySelectorAll('.v8-forum').forEach(e=>e.remove());
 if(sessionStorage.getItem('cms-preview')==='1'){let b=document.querySelector('#cms-preview-banner');if(!b){b=document.createElement('div');b.id='cms-preview-banner';b.style.cssText='position:fixed;bottom:12px;left:12px;z-index:1000;background:#eee0ff;color:#24182e;padding:12px 20px;border-radius:8px;font:14px system-ui';b.innerHTML='BẢN NHÁP — chỉ quản trị viên thấy · <a href="/admin">Về Studio</a> · <button id="cms-exit-preview">Thoát xem trước</button>';document.body.append(b);document.querySelector('#cms-exit-preview').onclick=()=>{sessionStorage.removeItem('cms-preview');location.href='/';};}}
};
const cmsOriginalApi=api;
api=async function(url,data){let preview=false;if(!window.INDIEVERSE_PAGES&&url==='/api/catalog'){if(new URLSearchParams(location.search).get('cms-preview')==='1')sessionStorage.setItem('cms-preview','1');preview=sessionStorage.getItem('cms-preview')==='1';}try{return await cmsOriginalApi(url+(preview?'?preview=1':''),data);}catch(e){if(!preview||![401,403].includes(e.status))throw e;sessionStorage.removeItem('cms-preview');const clean=new URL(location.href);clean.searchParams.delete('cms-preview');history.replaceState(null,'',clean);document.querySelector('#cms-preview-banner')?.remove();return cmsOriginalApi(url,data);}};

function cmsChrome(s){if(!s)return;
 const nav=document.querySelector('#site-header nav');if(nav){nav.innerHTML=s.navigation.map(n=>`<a href="${esc(n.href)}" ${route()===n.href?'class="active" aria-current="page"':''}>${esc(n.label)}</a>`).join('');}
 document.querySelectorAll('.logo').forEach(el=>{el.innerHTML=(s.logo?`<img src="${esc(s.logo)}" alt="" width="38" height="38" style="object-fit:contain">`:'<span class="logo-icon">✣</span>')+`<span>${esc(s.name)}<b>.</b></span>`;});
}
const cmsOriginalShell=shell;shell=function(){cmsOriginalShell();cmsChrome(catalog?.site);};

</script>
<script>
newsletter=function(){return `<section class="newsletter"><span class="mail-icon">✉</span><div class="eyebrow">BẢN TIN REVIEW GAME</div><h3>Đọc cùng chúng mình.</h3><p>Bản GitHub Pages chưa có dịch vụ gửi email. Những bài mới sẽ xuất hiện tại Góc indie và trang Đánh giá.</p><a class="primary" href="/features">Đọc Góc indie ↗</a></section>`;};
contactPage=function(){return `${crumbs([['Liên hệ']])}<section class="page-heading"><div class="eyebrow">LIÊN HỆ REVIEW GAME</div><h1>Hộp thư chưa mở.</h1><p>Bản GitHub Pages chưa kết nối dịch vụ nhận tin. Chúng mình chưa thể tiếp nhận lời nhắn qua website này.</p></section><div class="empty-state"><span>✉</span><h2>Tiếp tục khám phá</h2><p>Bạn vẫn có thể đọc bài, lưu game và ghi cảm nhận cá nhân trong trình duyệt.</p><a class="primary" href="/features">Đến Góc indie →</a></div>`;};
const originalInfoPage=infoPage;
infoPage=function(kind){if(kind==='review-policy')return originalInfoPage(kind);if(kind==='privacy')return `${crumbs([['Quyền riêng tư']])}<section class="page-heading"><div class="eyebrow">DỮ LIỆU CỦA BẠN</div><h1>Cuốn sổ ở trong trình duyệt.</h1><p>Thư viện, hồ sơ, bộ sưu tập và cảm nhận cá nhân được lưu bằng localStorage trên thiết bị này. Chúng không đồng bộ sang thiết bị khác hoặc đăng công khai.</p></section><article class="policy-document"><section><span>01</span><div><h2>Bạn kiểm soát dữ liệu cá nhân</h2><p>Bạn có thể sửa hoặc xóa từng mục qua giao diện và xuất thư viện ra tệp JSON. Xóa dữ liệu trang web trong cài đặt trình duyệt sẽ xóa cuốn sổ tại máy này.</p></div></section><section><span>02</span><div><h2>Dịch vụ bên ngoài</h2><p>Hình ảnh được tải từ Steam hoặc nhà phát triển, phông chữ từ Google Fonts. GitHub Pages phục vụ website tĩnh. Biểu mẫu liên hệ và bản tin hiện chưa nhận dữ liệu.</p></div></section><section><span>03</span><div><h2>Không có tài khoản đồng bộ</h2><p>Không có đăng nhập, hệ thống cộng đồng hoặc hộp thư trực tuyến trong bản này. Ghi chú và cảm nhận chỉ xuất hiện trên trình duyệt đã lưu chúng.</p></div></section></article>`;return `${crumbs([['Câu hỏi thường gặp']])}<section class="page-heading"><div class="eyebrow">CÂU HỎI THƯỜNG GẶP</div><h1>Những điều cần biết.</h1><p>Giới hạn của bản GitHub Pages, cách lưu hành trình và nguồn nội dung.</p></section><div class="help-accordion"><details><summary>Sổ tay có giữ sau khi tải lại?</summary><p>Có. Dữ liệu được giữ trong localStorage của trình duyệt này. Bạn có thể xuất thư viện thành tệp JSON.</p></details><details><summary>Cảm nhận của tôi có công khai không?</summary><p>Không. Cảm nhận chỉ lưu trong trình duyệt và chưa đồng bộ lên máy chủ.</p></details><details><summary>Liên hệ và bản tin hoạt động chưa?</summary><p>Chưa. Trang GitHub Pages không có dịch vụ nhận thư hoặc gửi email.</p></details><details><summary>Thông tin game và ảnh từ đâu?</summary><p>Thông tin, ảnh dẫn về Steam hoặc nguồn của nhà phát triển. Bài viết và điểm biên tập được ghi là nội dung minh họa.</p></details></div>`;};

</script>

<script>
/* Exam integration: Animate.css 4.1.1 + AOS 2.3.4, bundled with their licenses. */
let reviewAosInitialized=false;
const reviewOriginalRender=render;
render=function(){reviewOriginalRender();

 const hero=document.querySelector('.hero>img');if(hero){hero.fetchPriority='high';hero.loading='eager';}
 document.querySelectorAll('a[href^="/"]').forEach(a=>{const h=a.getAttribute('href');if(!h.startsWith('//'))a.setAttribute('href','#'+h);});
 document.querySelectorAll('.essay-toc a[href^="#"]:not([href^="#/"])').forEach(a=>a.dataset.chapter=a.getAttribute('href').slice(1));
 const title=document.querySelector('#page h1');if(title)title.classList.add('animate__animated','animate__fadeInUp');

};

</script>
<script>
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
let introTimer, revealObserver, introFocus;
function dismissIntro(){clearTimeout(introTimer);const overlay=document.getElementById('intro-hook');overlay.classList.add('dismissed');document.querySelectorAll('#site-header,#page,#site-footer').forEach(el=>el.inert=false);document.body.classList.remove('intro-active');if(overlay.contains(document.activeElement))(introFocus?.isConnected?introFocus:document.getElementById('page')).focus({preventScroll:true});try{sessionStorage.setItem('review-game-intro-seen','1');}catch{} }
function playIntro(replay=false){const overlay=document.getElementById('intro-hook');let seen=false;try{seen=sessionStorage.getItem('review-game-intro-seen')==='1';}catch{}if((seen&&!replay)||reducedMotion.matches){dismissIntro();return;}introFocus=document.activeElement;overlay.classList.remove('dismissed');document.querySelectorAll('#site-header,#page,#site-footer').forEach(el=>el.inert=true);document.body.classList.add('intro-active');document.getElementById('intro-skip').focus({preventScroll:true});clearTimeout(introTimer);introTimer=setTimeout(dismissIntro,650);}
document.getElementById('intro-skip').addEventListener('click',dismissIntro);
document.addEventListener('keydown',e=>{if(e.key==='Escape')dismissIntro();});
function readingProgress(){const bar=document.getElementById('reading-progress'),article=document.querySelector('.essay-content');bar.hidden=!article;if(!article)return;const top=article.getBoundingClientRect().top+scrollY,total=article.offsetHeight-innerHeight;const ratio=Math.max(0,Math.min(1,(scrollY-top)/Math.max(1,total)));const chapters=[...document.querySelectorAll('.essay-content section[id]')];let active=chapters[0]?.id;for(const chapter of chapters)if(chapter.getBoundingClientRect().top<=160)active=chapter.id;document.querySelectorAll('.essay-toc a[href^="#"]').forEach(a=>{const selected=a.hash==='#'+active;a.classList.toggle('active',selected);if(selected)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current');});bar.style.transform=`scaleX(${ratio})`;}
function animatePage(){const page=document.getElementById('page');page.classList.remove('page-enter');if(!reducedMotion.matches){void page.offsetWidth;page.classList.add('page-enter');revealObserver?.disconnect();revealObserver=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){e.target.classList.add('motion-reveal');revealObserver.unobserve(e.target);}},{threshold:.08});page.querySelectorAll('.dossier-tile,.reading-row,.series-card,.essay-chapter,.thought-index article,.editor-desks article,.series-stops li').forEach((el,i)=>{el.style.setProperty('--delay',(i%4)*55+'ms');revealObserver.observe(el);});}requestAnimationFrame(readingProgress);}
window.addEventListener('scroll',readingProgress,{passive:true});window.addEventListener('resize',readingProgress,{passive:true});
document.addEventListener('error',e=>{const el=e.target;if(el.tagName!=='IMG'||el.dataset.fallback)return;const match=/\/apps\/(\d+)\//.exec(el.src),app=el.dataset.app||match?.[1];if(!app)return;el.dataset.fallback='1';el.src=`https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/${app}/header.jpg`;const caption=el.closest('figure')?.querySelector('figcaption');if(caption)caption.textContent='Artwork quảng bá chính thức · Steam';},true);
playIntro();boot();

</script>
