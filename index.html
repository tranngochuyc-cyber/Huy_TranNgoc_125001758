  if(typeof DecompressionStream==='undefined')throw Error('Trình duyệt chưa hỗ trợ giải nén dữ liệu; hãy cập nhật trình duyệt.');
  const bytes=Uint8Array.from(atob(data.catalogGzipBase64),ch=>ch.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
})();
function reviewLocation(){const raw=location.hash.startsWith('#/')?location.hash.slice(1):'/';return new URL(raw,'https://review-game.invalid');}

</script>
<script>
/* Fragment routes keep every interior URL reloadable on GitHub Pages. */
/* Canonical in-page URLs keep Ctrl+Click and Open in new tab inside this GitHub Pages project. */
(function fixPagesLinks(){
  const normalize=()=>document.querySelectorAll('a[href^="/"]').forEach(a=>{
    const href=a.getAttribute('href');
    if(href&&!href.startsWith('//')&&!/^\/(?:assets|api)\//.test(href))a.setAttribute('href','#'+href);
  });
  new MutationObserver(normalize).observe(document.body,{childList:true,subtree:true});
  normalize();
})();

document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a||a.target||a.hasAttribute('download')||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey||e.button!==0)return;const href=a.getAttribute('href');if(!href)return;if(href.startsWith('#/')||href.startsWith('/')&&!href.startsWith('//')){e.preventDefault();e.stopImmediatePropagation();go(href.startsWith('#/')?href.slice(1):href);}else if(href.startsWith('#')){e.preventDefault();e.stopImmediatePropagation();const url=reviewLocation(),fragment=href.slice(1);let id=fragment;try{id=decodeURIComponent(fragment);}catch{}const section=document.getElementById(id);if(section){history.pushState({},'','#'+url.pathname+url.search+href);section.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});if(id==='page')section.focus({preventScroll:true});}else go(url.pathname+url.search+href);}},true);

<script>
// GitHub Pages adapter: personal data stays in this browser.
const pagesStorageKey='review-game-state-v1';
function pagesFresh(){return {profile:{name:'Người chơi indie',bio:'Mỗi game là một thế giới. Đây là hành trình của tôi.',favorite:'Phiêu lưu'},library:{},collections:[],comments:[],activity:[]};}
function pagesState(){try{const stored=JSON.parse(localStorage.getItem(pagesStorageKey));return stored&&stored.profile&&stored.library&&Array.isArray(stored.collections)&&Array.isArray(stored.comments)?stored:pagesFresh();}catch{return pagesFresh();}}
function pagesText(value,max=200){return typeof value==='string'?value.trim().slice(0,max):'';}
function pagesAssert(value,message){if(!value)throw Error(message);}
async function indieversePagesApi(path,data){
 if(path==='/api/catalog')return bundledCatalogPromise;
 const current=pagesState();
 if(path==='/api/state')return current;
 if(path==='/api/contact'||path==='/api/newsletter')throw Error('Bản GitHub Pages chưa có dịch vụ nhận thư. Vui lòng chưa gửi thông tin qua biểu mẫu này.');
 const catalog=window.indieversePagesCatalog;
 const activity=message=>{current.activity.unshift({message,date:new Date().toISOString()});current.activity=current.activity.slice(0,30);};
 switch(path){
  case '/api/library':{
   const game=catalog.games.find(g=>g.id===data.gameId);pagesAssert(game,'Không tìm thấy game.');
   if(data.remove){delete current.library[game.id];for(const collection of current.collections)collection.ids=collection.ids.filter(id=>id!==game.id);activity(`Đã bỏ ${game.name} khỏi thư viện.`);}
   else{pagesAssert(['wishlist','playing','completed','paused'].includes(data.status),'Trạng thái không hợp lệ.');const rating=data.rating===''||data.rating==null?null:Number(data.rating);pagesAssert(rating===null||(Number.isFinite(rating)&&rating>=0&&rating<=10),'Điểm phải từ 0 đến 10.');current.library[game.id]={status:data.status,note:pagesText(data.note,1000),rating,updated:new Date().toISOString()};activity(`Đã cập nhật ${game.name} trong thư viện.`);}break;
  }
  case '/api/profile':pagesAssert(pagesText(data.name,40),'Hãy nhập tên hiển thị.');current.profile={name:pagesText(data.name,40),bio:pagesText(data.bio,300),favorite:pagesText(data.favorite,40)};activity('Đã cập nhật hồ sơ người chơi.');break;
  case '/api/comments':pagesAssert(catalog.games.some(g=>g.id===data.gameId),'Không tìm thấy bài viết.');pagesAssert(pagesText(data.content,2000).length>=3,'Cảm nhận cần ít nhất 3 ký tự.');pagesAssert(current.comments.length<500,'Đã đạt giới hạn cảm nhận trên trình duyệt.');current.comments.unshift({id:crypto.randomUUID(),gameId:data.gameId,name:current.profile.name,content:pagesText(data.content,2000),spoiler:!!data.spoiler,date:new Date().toISOString()});activity('Đã viết một cảm nhận mới.');break;
  case '/api/comment-remove':current.comments=current.comments.filter(comment=>comment.id!==data.id);break;
  case '/api/collections':{
   if(data.remove){current.collections=current.collections.filter(collection=>collection.id!==data.id);break;}
   const existing=current.collections.find(collection=>collection.id===data.id);pagesAssert(existing||current.collections.length<50,'Bạn đã có 50 bộ sưu tập.');pagesAssert(pagesText(data.title,80),'Hãy đặt tên bộ sưu tập.');const ids=[...new Set(Array.isArray(data.ids)?data.ids:[])].filter(id=>catalog.games.some(g=>g.id===id));const collection={id:existing?.id||crypto.randomUUID(),title:pagesText(data.title,80),description:pagesText(data.description,500),ids};if(existing)Object.assign(existing,collection);else current.collections.push(collection);activity(`Đã lưu bộ sưu tập ${collection.title}.`);break;
  }
  default:throw Error('Không tìm thấy chức năng.');
 }
 try{localStorage.setItem(pagesStorageKey,JSON.stringify(current));}catch{throw Error('Trình duyệt không lưu được dữ liệu. Hãy kiểm tra dung lượng hoặc chế độ riêng tư.');}
 return current;
}

</script>

function home(){const catalog=discoveryCatalog;const g=catalog.games[heroIndex];return `<section class="intro"><div><div class="eyebrow"><span></span> DÀNH CHO NHỮNG TÂM HỒN MÊ GAME</div><h1>Thế giới nhỏ.<br class="mobile-break"> <span>Trải nghiệm lớn.</span></h1><p>Những tựa game độc lập đáng chơi. Những câu chuyện đáng kể.</p></div><div class="intro-note"><span>✧</span><p>Mỗi game là một thế giới.<br>Hãy tìm thế giới của bạn.</p></div></section><section class="featured" aria-label="Review nổi bật"><article class="hero"><img src="${img(g,'library_hero')}" alt="${esc(g.name)}"><div class="hero-shade"></div><div class="hero-top"><span class="label">✦ LỰA CHỌN CỦA BIÊN TẬP</span><span class="hero-number">0${heroIndex+1} <span>/ 03</span></span></div><div class="hero-content"><div class="tags"><span>${g.type}</span><span>${g.genre}</span></div><h2>${g.name}</h2><p>${['Lạc vào lòng đất. Tìm thấy cả một thế giới.','Ngọn núi ở bên trong mỗi chúng ta.','Một chú cáo nhỏ. Một bí mật lớn.'][heroIndex]}</p><div class="hero-bottom"><a class="primary" href="${ru(g)}">Đọc bài đánh giá ↗</a><a class="hero-author" href="/authors/${g.authorSlug}">${avatar(g.author)} ${g.author} <small>· 5 phút đọc</small></a></div></div><div class="hero-controls"><button aria-label="Review nổi bật trước" data-hero="-1">←</button><div>${[0,1,2].map(i=>`<b class="${i===heroIndex?'active':''}"></b>`).join('')}</div><button aria-label="Review nổi bật tiếp theo" data-hero="1">→</button></div><a class="hero-score" href="/review-policy"><strong>${g.score==null?'—':g.score.toFixed(1)}</strong><span>ĐÁNG CHƠI</span></a></article><div class="feature-side">${[1,2].map(id=>{const s=catalog.games[id];return `<a class="side-card" href="${ru(s)}"><img src="${img(s)}" alt="${esc(s.name)}"><div class="card-shade"></div><span class="small-label">${s.type} · ${s.genre.toUpperCase()}</span><div class="side-content"><span class="mini-score">${s.score==null?'—':s.score.toFixed(1)}</span><h2>${s.name}</h2><p>${id===1?'Ngọn núi ở bên trong mỗi chúng ta.':'Một chú cáo nhỏ. Một bí mật lớn.'}</p><span class="text-link">Khám phá câu chuyện ↗</span></div></a>`;}).join('')}</div></section><div class="discovery-strip"><span class="strip-icon">⌘</span><p>Không cần một studio lớn để tạo nên <strong>một trải nghiệm phi thường.</strong></p><a href="/games">Tìm game tiếp theo của bạn →</a></div><section class="content-layout"><div><div class="eyebrow">CHƠI THẬT. CẢM NHẬN THẬT.</div><div class="heading-line"><h2>Review mới nhất<span>.</span></h2><a href="/reviews" class="read-link">Tất cả bài viết ↗</a></div><div class="home-category-links"><a href="/reviews">Tất cả review</a><a href="/reviews?type=2D">Game 2D</a><a href="/reviews?type=3D">Game 3D</a><a href="/reviews?genre=Cozy">Cozy</a></div>${cards(catalog.games.slice(0,6))}<a class="load-more" href="/reviews">Khám phá tất cả bài đánh giá →</a></div>${sidebar()}</section><section class="collections"><div class="eyebrow">CHỌN MỘT TÂM TRẠNG</div><div class="heading-line"><h2>Hôm nay bạn muốn chơi gì?</h2><a class="read-link" href="/collections">Tất cả bộ sưu tập ↗</a></div><div class="collection-preview-grid">${catalog.collections.slice(0,3).map(c=>collectionCard(c)).join('')}</div></section><section class="home-features"><div class="heading-line"><h2>Chuyện ngoài màn hình<span>.</span></h2><a class="read-link" href="/features">Góc indie ↗</a></div><div class="home-journal-grid">${discoveryCatalog.features.map(f=>{return homeFeatureBySlug(f.slug);}).join('')}</div></section>`;}
function filters(){const p=qp();return `<form class="catalog-controls" data-form="filters"><div class="search-control"><span>⌕</span><input type="search" name="q" aria-label="Tìm tên game" placeholder="Tên game, thể loại, studio…" value="${esc(p.get('q')||'')}"><button type="submit">Tìm kiếm</button></div><div class="filter-options">${[['type','Không gian',[['','Tất cả game'],['2D','2D'],['3D','3D']]],['genre','Thể loại',[['','Tất cả thể loại'],...['Phiêu lưu','Hành động','Cozy','Giải đố','Roguelike','RPG','Sinh tồn','Kinh dị','Platformer','Khám phá'].map(v=>[v,v])]],['score','Điểm review',[['','Mọi mức điểm'],['9','Từ 9 điểm'],['9.5','Từ 9.5 điểm']]],['sort','Sắp xếp',[['latest','Review mới nhất'],['score','Điểm cao nhất'],['name','Tên game A–Z']]]].map(([key,label,options])=>`<label>${label}<select name="${key}">${options.map(([v,l])=>`<option value="${v}" ${p.get(key)===v?'selected':''}>${l}</option>`).join('')}</select></label>`).join('')}<button class="outline-button" type="submit">Áp dụng</button><a href="${route()}" class="reset-filter">Đặt lại</a></div></form>`;}
function pagination(count){const total=Math.ceil(count/6),current=Math.min(Math.max(Number(qp().get('page'))||1,1),Math.max(1,total)),p=qp();return total<2?'':`<nav class="pagination" aria-label="Phân trang">${Array.from({length:total},(_,i)=>{p.set('page',i+1);return `<a href="${route()}?${esc(p.toString())}" ${current===i+1?'class="current" aria-current="page"':''}>${i+1}</a>`;}).join('')}<span>Trang ${current} / ${total}</span></nav>`;}
function comments(g){const cs=state.comments.filter(c=>c.gameId===g.id);return `<section id="comments" class="comments-section"><h2>Cảm nhận của bạn <span>(${cs.length})</span></h2><p class="section-description">Một góc để lưu cảm nhận cá nhân. Bình luận được lưu cho phiên sử dụng tại máy này.</p><form data-form="comment" data-game="${g.id}" class="comment-form"><label for="comment-content">Bạn nghĩ gì về ${g.name}?</label><textarea id="comment-content" name="content" minlength="3" maxlength="2000" required placeholder="Một khoảnh khắc, một điều bạn thích hoặc một điểm cần cải thiện…"></textarea><div class="comment-actions"><label class="checkbox-label"><input type="checkbox" name="spoiler"> Có tiết lộ nội dung game</label><button class="primary" type="submit">Lưu cảm nhận ↗</button></div><p class="form-feedback" role="status"></p></form><div class="comment-list">${cs.map(c=>`<article class="comment"><div class="comment-head">${avatar(c.name)}<strong>${esc(c.name)}</strong><time>${new Date(c.date).toLocaleDateString('vi-VN')}</time><button data-remove-comment="${c.id}">Xóa</button></div>${c.spoiler?`<details><summary>Có tiết lộ nội dung — nhấn để đọc</summary><p>${esc(c.content)}</p></details>`:`<p>${esc(c.content)}</p>`}</article>`).join('')||'<p class="quiet-empty">Chưa có cảm nhận. Bắt đầu câu chuyện của bạn ở phía trên.</p>'}</div></section>`;}
function render(){shell();const path=route(),[section,slug,...rest]=path.slice(1).split('/');let html,title;const g=catalog.games.find(g=>g.slug===slug);if(rest.length){html=notFound();title='Không tìm thấy';}
else if(path==='/'){html=home();title='Thế giới nhỏ. Trải nghiệm lớn.';}
else if(section==='play'){html=V8.page(slug);title='Play Lab';}
else if(path==='/login'){html=loginPage();title='Đăng nhập';}
else if(path==='/games'||path==='/reviews'){html=browse(section);title=section==='games'?'Kho game indie':'Bài đánh giá';}
else if(section==='games'&&g){html=gameDetail(g);title=g.name;}
else if(section==='reviews'&&g){html=reviewDetail(g);title=g.title;}
else if(path==='/collections'){html=collectionsPage();title='Chuyên đề';}
else if(section==='collections'&&slug){const personal=slug.startsWith('mine-'),c=personal?state.collections.find(c=>'mine-'+c.id===slug):[...catalog.collections,...catalog.legacyCollections].find(c=>c.slug===slug);html=c?collectionDetail(c,personal):notFound();title=c?.title||'Không tìm thấy';}
else if(path==='/library'){html=libraryPage();title='Thư viện của tôi';}
else if(path==='/profile'){html=profilePage();title='Hồ sơ của tôi';}
else if(path==='/settings'){html=settingsPage();title='Cài đặt hồ sơ';}
else if(path==='/search'){html=searchPage();title='Tìm kiếm';}
else if(path==='/authors'){html=authorsPage();title='Tác giả';}
else if(section==='authors'&&slug){const a=catalog.authors.find(a=>a.slug===slug);html=a?authorsPage(a):notFound();title=a?.name||'Không tìm thấy';}
else if(path==='/features'){html=featuresPage();title='Góc indie';}
else if(section==='features'&&slug){const f=[...catalog.features,...catalog.legacyFeatures].find(f=>f.slug===slug);html=f?featuresPage(f):notFound();title=f?.title||'Không tìm thấy';}
else if(path==='/about'){html=aboutPage();title='Về Review Game';}
else if(path==='/contact'){html=contactPage();title='Liên hệ';}
else if(['/faq','/privacy','/review-policy'].includes(path)){html=infoPage(section);title=({'faq':'Câu hỏi thường gặp','privacy':'Quyền riêng tư','review-policy':'Cách chấm điểm'})[section];}
else{html=notFound();title='Không tìm thấy';}
$('#page').innerHTML=html;document.title=`${title} — Review Game`;document.body.dataset.page=section||'home';animatePage();if(reviewLocation().hash)requestAnimationFrame(()=>document.getElementById(decodeURIComponent(reviewLocation().hash.slice(1)))?.scrollIntoView({behavior:reducedMotion.matches?'instant':'smooth'}));}
function openDialog(content){lastFocus=document.activeElement;const d=$('#action-dialog');d.innerHTML=`<button class="close-dialog" data-action="close-dialog" aria-label="Đóng hộp thoại">✕</button>${content}`;if(!d.open)d.showModal();}
function gameEditor(id){const g=catalog.games.find(g=>g.id===id),e=state.library[id]||{status:'wishlist',rating:null,note:''};openDialog(`<div class="dialog-body"><div class="dialog-game-heading"><img src="${img(g)}" alt="${esc(g.name)}"><div><div class="eyebrow">HÀNH TRÌNH CỦA BẠN</div><h2 id="dialog-title">${g.name}</h2></div></div><form data-form="game" data-game="${id}" class="stack-form"><label>Trạng thái chơi<select name="status">${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${e.status===k?'selected':''}>${v}</option>`).join('')}</select></label><label>Điểm của bạn <span class="muted">(tùy chọn)</span><input type="number" name="rating" min="0" max="10" step="0.5" value="${e.rating??''}" placeholder="Từ 0 đến 10"></label><label>Điều bạn muốn nhớ<textarea name="note" maxlength="1000" placeholder="Một khoảnh khắc, một mục tiêu hoặc lý do bạn muốn chơi…">${esc(e.note)}</textarea></label><div class="button-row"><button type="submit" class="primary">Lưu hành trình ✓</button>${state.library[id]?`<button type="button" class="danger-link" data-remove-game="${id}">Bỏ khỏi thư viện</button>`:''}</div><p class="form-feedback" role="status"></p></form></div>`);}
function collectionEditor(id){const c=state.collections.find(c=>c.id===id)||{title:'',description:'',ids:[]};openDialog(`<div class="dialog-body"><div class="eyebrow">MỘT GÓC DO BẠN LỰA CHỌN</div><h2 id="dialog-title">${id?'Chỉnh sửa':'Tạo'} bộ sưu tập</h2><form data-form="collection" data-id="${id||''}" class="stack-form"><label>Tên bộ sưu tập<input name="title" required maxlength="80" value="${esc(c.title)}" placeholder="Ví dụ: Những câu chuyện mình yêu"></label><label>Đôi lời giới thiệu<textarea name="description" maxlength="500" placeholder="Điều gì kết nối những game này?">${esc(c.description)}</textarea></label><fieldset class="collection-picker"><legend>Chọn game</legend>${catalog.games.map(g=>`<label><input type="checkbox" name="ids" value="${g.id}" ${c.ids.includes(g.id)?'checked':''}><img src="${img(g)}" alt="" loading="lazy"><span>${g.name}<small>${g.type} · ${g.genre.split(' · ')[0]}</small></span></label>`).join('')}</fieldset><button class="primary" type="submit">Lưu bộ sưu tập ✓</button><p class="form-feedback" role="status"></p></form></div>`);}
async function update(path,data){state=await api(path,data);shell();}
document.addEventListener('click',async e=>{try{const a=e.target.closest('a');if(a){const u=new URL(a.href,location.href);if(u.origin===location.origin&&!/^\/(admin|api|uploads)(\/|$)/.test(u.pathname)&&!a.target&&!a.hasAttribute('download')&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey&&e.button===0){if(u.pathname===location.pathname&&u.search===location.search&&u.hash){e.preventDefault();history.pushState({},'',u.hash);document.getElementById(decodeURIComponent(u.hash.slice(1)))?.scrollIntoView({behavior:reducedMotion.matches?'instant':'smooth'});return;}e.preventDefault();go(u.pathname+u.search+u.hash);return;}}
const b=e.target.closest('button');if(!b)return;
if(b.dataset.hero){heroIndex=(heroIndex+Number(b.dataset.hero)+3)%3;$('#page').innerHTML=home();return;}
if(b.dataset.query){query({[b.dataset.query]:b.dataset.value});return;}
if(b.dataset.editGame){gameEditor(Number(b.dataset.editGame));return;}
if(b.dataset.save){const id=Number(b.dataset.save);if(state.library[id])gameEditor(id);else{b.disabled=true;await update('/api/library',{gameId:id,status:'wishlist'});document.querySelectorAll(`[data-save="${id}"]`).forEach(x=>{x.classList.add('saved');x.textContent='♥';x.setAttribute('aria-label',`Chỉnh sửa ${catalog.games[id].name}`);x.setAttribute('aria-pressed','true');x.disabled=false;});toast('Đã thêm game vào danh sách muốn chơi.');}return;}
if(b.dataset.removeGame){await update('/api/library',{gameId:Number(b.dataset.removeGame),remove:true});closeDialog();render();toast('Đã bỏ game khỏi thư viện.');return;}
if(b.dataset.editCollection){collectionEditor(b.dataset.editCollection);return;}
if(b.dataset.deleteCollection){await update('/api/collections',{id:b.dataset.deleteCollection,remove:true});go('/collections?tab=mine');toast('Đã xóa bộ sưu tập. Các game vẫn trong thư viện.');return;}
if(b.dataset.addCollection){const c=[...catalog.collections,...catalog.legacyCollections].find(c=>c.slug===b.dataset.addCollection);b.disabled=true;for(const id of c.ids)if(!state.library[id])state=await api('/api/library',{gameId:id,status:'wishlist'});shell();b.disabled=false;toast('Đã lưu những game mới vào thư viện.');return;}
if(b.dataset.removeComment){await update('/api/comment-remove',{id:b.dataset.removeComment});const y=scrollY;render();window.scrollTo(0,y);toast('Đã xóa cảm nhận.');return;}
if(b.dataset.art){const g=catalog.games[Number(b.dataset.art)];openDialog(`<div class="art-lightbox"><h2 id="dialog-title">Artwork ${g.name}</h2><img src="${img(g,b.dataset.kind)}" alt="${esc(g.name)}"><p>Artwork chính thức · Steam</p></div>`);return;}
if(b.dataset.openImage){const g=catalog.games[Number(b.dataset.imageGame)];openDialog(`<div class="image-viewer"><img src="${esc(b.dataset.openImage)}" alt="${esc(g.name)}"><h2 id="dialog-title">${esc(g.name)} · Hình minh họa chính thức</h2></div>`);return;}switch(b.dataset.action){case 'replay-intro':playIntro(true);break;case 'menu':{const nav=$('#main-nav');nav.classList.toggle('mobile-open');b.setAttribute('aria-expanded',nav.classList.contains('mobile-open'));break;}case 'top':window.scrollTo({top:0,behavior:reducedMotion.matches?'instant':'smooth'});break;case 'new-collection':collectionEditor();break;case 'close-dialog':closeDialog();break;case 'copy-link':try{await navigator.clipboard.writeText(location.href);toast('Đã sao chép liên kết bài viết.');}catch{openDialog(`<div class="dialog-body"><h2 id="dialog-title">Liên kết bài viết</h2><input class="copy-url" value="${esc(location.href)}" readonly aria-label="Liên kết để sao chép"></div>`);}break;case 'export-library':{const entries=catalog.games.filter(g=>state.library[g.id]).map(g=>({name:g.name,...state.library[g.id]})),blob=new Blob([JSON.stringify({profile:state.profile,games:entries,collections:state.collections},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='indieverse-thu-vien.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Đã xuất thư viện của bạn.');break;}}
}catch(error){const b=e.target.closest('button');if(b)b.disabled=false;toast(error.message||'Kết nối bị gián đoạn. Hãy thử lại.');}});
document.addEventListener('submit',async e=>{const f=e.target;if(!f.dataset.form)return;e.preventDefault();const data=new FormData(f),fields=Object.fromEntries(data),kind=f.dataset.form,feedback=f.querySelector('.form-feedback'),submit=f.querySelector('[type="submit"],button:not([type])');if(submit)submit.disabled=true;if(feedback)feedback.textContent='Đang lưu…';try{switch(kind){
case 'game-finder':go('/features?'+new URLSearchParams({...fields,mode:'finder',wave:0}).toString()+'#goi-y');break;
case 'game-compare':go('/features?'+new URLSearchParams({...fields,mode:'compare'}).toString());break;
case 'filters':query({q:fields.q,type:fields.type,genre:fields.genre,country:fields.country,region:fields.country?null:qp().get('region'),score:fields.score,sort:fields.sort==='latest'?null:fields.sort});break;
case 'search':go('/search?q='+encodeURIComponent(fields.q.trim()));break;
case 'library-search':query({q:fields.q,sort:fields.sort});break;
case 'game':await update('/api/library',{gameId:Number(f.dataset.game),status:fields.status,rating:fields.rating,note:fields.note});closeDialog();render();toast('Đã lưu hành trình của bạn.');break;
case 'profile':await update('/api/profile',fields);go('/profile');toast('Đã cập nhật hồ sơ.');break;
case 'collection':await update('/api/collections',{...fields,id:f.dataset.id||undefined,ids:data.getAll('ids').map(Number)});const c=f.dataset.id?state.collections.find(c=>c.id===f.dataset.id):state.collections.at(-1);closeDialog();go('/collections/mine-'+c.id);toast('Đã lưu bộ sưu tập.');break;
case 'comment':await update('/api/comments',{gameId:Number(f.dataset.game),content:fields.content,spoiler:data.has('spoiler')});const y=scrollY;render();window.scrollTo(0,y);toast('Đã lưu cảm nhận của bạn.');break;
case 'newsletter':case 'contact':{const r=await api('/api/'+kind,fields);feedback.textContent=r.message;feedback.classList.add('success');f.reset();break;}
}}catch(error){if(feedback){feedback.textContent=error.message||'Không thể lưu. Hãy kiểm tra máy chủ và thử lại.';feedback.classList.remove('success');}else toast(error.message);}finally{if(submit)submit.disabled=false;}});
$('#action-dialog').addEventListener('click',e=>{if(e.target!==$('#action-dialog'))return;const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();});
$('#action-dialog').addEventListener('close',()=>{if(lastFocus?.isConnected)lastFocus.focus({preventScroll:true});});
window.addEventListener('popstate',()=>{closeDialog();render();});
async function boot(){try{[catalog,state]=await Promise.all([api('/api/catalog'),api('/api/state')]);window.IndieverseCMS?.prepare(catalog);discoveryCatalog=catalog.home;render();}catch(error){console.error('Review Game khởi động thất bại:',error);$('#page').innerHTML='<div class="empty-state"><h1>Không tải được dữ liệu Review Game.</h1><p>Hãy kiểm tra kết nối mạng và thử tải lại trang.</p><button class="primary" id="retry-boot">Thử lại →</button></div>';$('#retry-boot').onclick=boot;}}

</script>
<script>
/* Module: interiors.js */
function asianShelf(){const vn=catalog.games.filter(g=>g.country==='Việt Nam'),asia=catalog.games.filter(g=>countryRegion(g.country)==='asia');const selected=['Hoa','The Death: Thần Trùng',"Brother Hai's Pho Restaurant",'Curse of The Lineage'].map(n=>catalog.games.find(g=>g.name===n));return `<section class="asian-shelf" aria-labelledby="asian-shelf-title"><div class="asian-shelf-heading"><div><span class="eyebrow">GẦN HƠN BẠN NGHĨ / 100 GAME VỪA THÊM</span><h2 id="asian-shelf-title">Từ Việt Nam,<br><em>đi khắp châu Á.</em></h2><p>Một khu rừng vẽ tay. Một con ngõ Hà Nội. Một quán phở. Những câu chuyện quen, được kể bằng những cách chơi rất khác nhau.</p></div><div class="asian-entry"><a class="primary-button" href="/games?country=Vi%E1%BB%87t%20Nam#catalog-list">Game Việt Nam <strong>${vn.length}</strong> ↗</a><a class="outline-button" href="/games?region=asia#catalog-list">Khám phá châu Á <strong>${asia.length}</strong> ↗</a><small>Quốc gia theo studio hoặc tác giả.<br>100 hồ sơ mới từ 11 nguồn gốc tại châu Á.</small></div></div><div class="asian-shelf-grid">${selected.map(g=>`<a class="asian-game" href="/reviews/${g.slug}"><img src="${img(g)}" alt="Artwork ${esc(g.name)}"><div><span>VIỆT NAM · ${esc(g.displayType)}</span><h3>${esc(g.name)}</h3><p>${esc(g.hook)}</p><b>Mở câu chuyện ↗</b></div></a>`).join('')}</div><nav class="asian-chips" aria-label="Game theo quốc gia châu Á">${['Việt Nam','Nhật Bản','Hàn Quốc','Trung Quốc','Đài Loan','Indonesia','Singapore','Malaysia','Thái Lan','Philippines','Ấn Độ'].map(c=>`<a href="/games?country=${encodeURIComponent(c)}#catalog-list" class="${qp().get('country')===c?'selected':''}">${c}<span>${catalog.games.filter(g=>g.country===c).length}</span></a>`).join('')}</nav></section>`;}
function countryRegion(c){if(['Canada','Hoa Kỳ'].includes(c))return 'north-america';if(['Brazil','Venezuela'].includes(c))return 'south-america';if(['Ấn Độ','Đài Loan','Hàn Quốc','Indonesia','Nhật Bản','Trung Quốc','Việt Nam','Singapore','Malaysia','Thái Lan','Philippines'].includes(c))return 'asia';if(c==='Nam Phi')return 'africa';if(['Australia','New Zealand'].includes(c))return 'oceania';if(c==='Nhóm làm việc từ xa')return 'remote';return 'europe';}
const scoreText=g=>Number.isFinite(g.score)?g.score.toFixed(1):'—';
const shortText=(text,max=170)=>text.length>max?text.slice(0,max).replace(/\s+\S*$/,'')+'…':text;
function folio(k,title,copy,aside=''){return `<section class="folio-heading"><div><span class="eyebrow">${k}</span><h1>${title}</h1><p>${copy}</p></div>${aside}</section>`;}
function indexPager(count,size=12){const total=Math.ceil(count/size),page=Math.min(Math.max(Number(qp().get('page'))||1,1),Math.max(total,1));return total<2?'':`<nav class="pagination" aria-label="Phân trang">${Array.from({length:total},(_,i)=>{const p=qp();p.set('page',i+1);return `<a href="${route()}?${esc(p.toString())}${route()==='/games'?'#catalog-list':'#reading-list'}" ${page===i+1?'class="current" aria-current="page"':''}>${i+1}</a>`;}).join('')}</nav>`;}
function indexFilters(){const p=qp(),countries=[...new Set(catalog.games.map(g=>g.country))].sort((a,b)=>a.localeCompare(b,'vi'));return `<form data-form="filters" class="index-filters"><label class="index-search">Tìm trong danh mục<input type="search" name="q" value="${esc(p.get('q')||'')}" placeholder="Tên game, studio, một ý tưởng…"></label>${[['type','Không gian',['2D','3D']],['genre','Lối chơi',[...new Set(catalog.games.flatMap(g=>g.genre.split(' · ')))].sort()],['country','Nguồn gốc studio',countries]].map(([key,label,values])=>`<label>${label}<select name="${key}"><option value="">Tất cả</option>${values.map(v=>`<option ${p.get(key)===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`).join('')}<label>Sắp xếp<select name="sort">${[['name','Tên A–Z'],['country','Theo quốc gia'],['reading','Bài đọc dài trước']].map(([v,t])=>`<option value="${v}" ${p.get('sort')===v?'selected':''}>${t}</option>`).join('')}</select></label><button class="primary">Lọc danh mục →</button></form>`;}
function filtered(){const p=qp(),q=(p.get('q')||'').toLocaleLowerCase('vi');let gs=catalog.games.filter(g=>`${g.name} ${g.genre} ${g.developer} ${g.country} ${g.theme} ${g.type}`.toLocaleLowerCase('vi').includes(q));if(p.get('type'))gs=gs.filter(g=>g.type===p.get('type'));if(p.get('genre'))gs=gs.filter(g=>g.genre.includes(p.get('genre')));if(p.get('region'))gs=gs.filter(g=>countryRegion(g.country)===p.get('region'));if(p.get('country'))gs=gs.filter(g=>g.country===p.get('country'));if(p.get('score'))gs=gs.filter(g=>Number.isFinite(g.score)&&g.score>=Number(p.get('score')));if(p.get('sort')==='country')gs.sort((a,b)=>a.country.localeCompare(b.country,'vi'));else if(p.get('sort')==='reading')gs.sort((a,b)=>b.wordCount-a.wordCount);else gs.sort((a,b)=>a.name.localeCompare(b.name));return gs;}
function dossierTile(g){return `<article class="dossier-tile"><a class="dossier-cover" href="${gu(g)}"><img src="${img(g,'library_600x900')}" alt="Bìa ${g.name}" loading="lazy"><span>${esc(g.displayType)}</span></a><div class="dossier-caption"><span>${esc(g.country)}</span><h2><a href="${gu(g)}">${esc(g.name)}</a></h2><p>${esc(g.theme)}</p><div><small>${esc(g.developer)}</small><button class="mini-add" data-edit-game="${g.id}" aria-label="Theo dõi ${esc(g.name)}">${state.library[g.id]?'✓':'＋'}</button></div></div></article>`;}
function readingRow(g,i=0){return `<article class="reading-row"><span class="reading-number">${String(i+1).padStart(2,'0')}</span><div><div class="reading-kicker">${esc(g.theme)} <span>· ${g.readTime} phút đọc</span></div><h2><a href="${ru(g)}">${esc(g.hook||g.title.split(' — ')[1])}</a></h2><p>${esc(shortText(g.lede,200))}</p><div class="reading-byline"><strong>${esc(g.name)}</strong><span>${esc(g.country)}</span><a href="/authors/${g.authorSlug}">${esc(g.author)}</a></div></div><a class="reading-image" href="${ru(g)}" aria-label="Đọc phân tích ${esc(g.name)}"><img src="${img(g)}" alt="${esc(g.name)}" loading="lazy"><span>Đọc bài ↗</span></a></article>`;}
function atlas(){const regions=[['north-america','BẮC MỸ','celeste'],['south-america','NAM MỸ','unsighted'],['europe','CHÂU ÂU','neva'],['africa','CHÂU PHI','terra-nil'],['asia','CHÂU Á','nine-sols'],['oceania','CHÂU ĐẠI DƯƠNG','hollow-knight']];const countries=[...new Set(catalog.games.map(g=>g.country))].sort((a,b)=>a.localeCompare(b,'vi'));return `<section class="country-atlas region-directory"><div class="country-atlas-heading"><div><span class="eyebrow">STUDIO QUANH THẾ GIỚI</span><h2>Một nơi chốn. Nhiều tiếng nói.</h2><p>Đi từ một khu vực tới những game được làm ở đó. Quốc gia chỉ nguồn gốc studio hoặc tác giả, không phải bối cảnh câu chuyện.</p></div><a class="outline-button" href="/games#catalog-list">Tất cả ${catalog.games.length} game ↗</a></div><div class="region-postcards">${regions.map(([key,name,slug])=>{const games=catalog.games.filter(g=>countryRegion(g.country)===key),g=catalog.games.find(x=>x.slug===slug);return `<a href="/games?region=${key}#catalog-list" class="region-postcard ${qp().get('region')===key?'selected':''}"><img src="${img(g)}" alt=""><div><span>${name}</span><strong>${games.length} game</strong><small>${esc(g.name)} · ${esc(g.country)} <b>↗</b></small></div></a>`;}).join('')}</div><details class="country-dropdown" ${qp().has('country')?'open':''}><summary>Chọn trực tiếp một quốc gia <span>${countries.length} nguồn gốc studio ＋</span></summary><nav class="country-picker" aria-label="Chọn quốc gia">${countries.map((country,i)=>`<a class="${qp().get('country')===country?'selected':''}" href="/games?country=${encodeURIComponent(country)}#catalog-list"><span>${String(i+1).padStart(2,'0')}</span><strong>${esc(country)}</strong><small>${catalog.games.filter(g=>g.country===country).length} game</small></a>`).join('')}</nav></details></section>`;}
function browse(kind){const gs=filtered(),page=Math.min(Math.max(Number(qp().get('page'))||1,1),Math.max(Math.ceil(gs.length/12),1)),slice=gs.slice((page-1)*12,page*12);if(kind==='reviews')return `${crumbs([['Phòng đọc']])}${folio('REVIEW GAME / PHÒNG ĐỌC','Đọc để hiểu.<br><em>Không chỉ để chấm.</em>','Những bài phân tích đi vào một ý tưởng của từng game: điều nó khiến bạn làm, cảm thấy và phải cân nhắc.',`<div class="folio-stamp"><strong>${catalog.games.length}</strong><span>GÓC NHÌN RIÊNG</span><small>Không kể trước các nút thắt</small></div>`)}<div class="reading-manifesto"><span>01 / CHỌN MỘT CÂU HỎI</span><p>Vì sao một con dấu gây khó nghĩ? Một lần thua dạy được gì? Khi nào màu sắc bắt đầu kể chuyện?</p></div>${indexFilters()}<div class="index-result"><p>${gs.length} bài phù hợp${qp().get('country')?' · '+esc(qp().get('country')):''}</p><a href="/reviews">Bỏ bộ lọc ↗</a></div><div class="reading-index" id="reading-list">${slice.map((g,i)=>readingRow(g,(page-1)*12+i)).join('')||empty('Chưa có bài khớp lựa chọn','Đổi một từ khóa hoặc bỏ bộ lọc.','/reviews','Mở lại phòng đọc')}</div>${indexPager(gs.length)}`;return `${crumbs([['Atlas game']])}${folio('DANH MỤC / '+catalog.games.length+' THẾ GIỚI','Một vòng quanh<br><em>những studio nhỏ.</em>','Hai trăm năm mươi game, nhiều cách chơi và những studio đến từ khắp thế giới. Lọc theo studio, nguồn gốc hoặc cách chơi để tìm một hồ sơ đáng mở.',`<div class="folio-stamp"><strong>+100</strong><span>TỰA VỪA THÊM</span><small>2D · 2.5D · 3D</small></div>`)}${asianShelf()}${atlas()}${indexFilters()}<div class="index-result"><p>${gs.length} hồ sơ phù hợp · ${slice.length} đang hiển thị</p><a href="/games">Bỏ bộ lọc ↗</a></div><div class="dossier-grid" id="catalog-list">${slice.map(dossierTile).join('')||empty('Atlas chưa có điểm này','Thử tên game hoặc một studio khác.','/games','Xem toàn bộ atlas')}</div>${indexPager(gs.length)}`;}
function facts(g){return `<dl class="game-facts">${[['Studio / tác giả',g.developer],['Nguồn gốc',g.country],['Nhà phát hành',g.publisher],['Phát hành Steam',g.release],['Không gian',g.displayType],['Lối chơi',g.genre]].filter(([,v])=>v).map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`;}
function mediaFigure(g,index,cls='inline-scene'){const media=g.images[index];const src=assetUrl(media?.src)||img(g,index%2?'header':'library_hero');const emblem=media?.kind==='Biểu tượng quảng bá chính thức';return `<figure class="${cls}${emblem?' brand-scene':''}"><button data-open-image="${esc(src)}" data-image-game="${g.id}" aria-label="Xem lớn hình minh họa ${esc(g.name)} ${index+1}"><img src="${esc(src)}" data-app="${g.app}" alt="${esc(media?.alt||'Hình minh họa '+g.name+' do nhà phát triển cung cấp')}" loading="lazy">${emblem?'<strong>Dấu hiệu nhận diện trên Steam</strong>':''}<span>⤢ Xem lớn</span></button><figcaption>${esc(media?.kind||'Artwork quảng bá chính thức')} · <a href="${esc(media?.sourceUrl||g.source)}" target="_blank" rel="noopener">${esc(media?.credit||g.developer+(media?' / Steam':' / Steam'))} ↗</a></figcaption></figure>`;}
function gameDetail(g){const tab=qp().get('tab')||'dossier',entry=state.library[g.id];return `${crumbs([['Atlas game','/games'],[g.name]])}<section class="passport"><div class="passport-art"><img src="${img(g,'library_600x900')}" alt="Bìa ${esc(g.name)}"></div><div class="passport-copy"><span class="eyebrow">HỒ SƠ ${String(g.id+1).padStart(2,'0')} / ${esc(g.country)}</span><h1>${esc(g.name)}</h1><p class="passport-theme">${esc(g.theme)}</p><p>${esc(g.pitch)}</p><div class="passport-facts"><span>${esc(g.displayType)}</span><span>${esc(g.genre)}</span><span>${esc(g.developer)}</span></div><div class="button-row"><button class="primary" data-edit-game="${g.id}">${entry?'Sửa sổ tay':'Bắt đầu theo dõi'} ↗</button><a class="outline-button" href="${g.source}" target="_blank" rel="noopener">Trang chính thức ↗</a></div><p class="passport-state">${entry?`${labels[entry.status]}${entry.rating!==null?' · Bạn chấm '+entry.rating+'/10':''}`:'Chưa có trong sổ tay của bạn'}</p></div></section><nav class="page-tabs" aria-label="Các phần hồ sơ"><a class="${tab==='dossier'||tab==='overview'?'selected':''}" href="${gu(g)}">Hồ sơ trải nghiệm</a><a class="${tab==='journal'?'selected':''}" href="${gu(g)}?tab=journal">Sổ tay cá nhân</a><a href="${ru(g)}">Phân tích chuyên sâu ↗</a></nav>${tab==='journal'?`<section class="journal-sheet"><span class="eyebrow">TRANG RIÊNG / ${esc(g.name)}</span><h2>${entry?'Bạn đã để lại điều gì?':'Tờ giấy còn trống.'}</h2><p>${entry?.note?esc(entry.note):'Một mục tiêu cho lần chơi tới, một điều chưa hiểu hoặc một khoảnh khắc muốn nhớ. Viết ngắn thôi, miễn là của bạn.'}</p><button class="primary" data-edit-game="${g.id}">Viết vào sổ tay →</button></section>`:`<div class="passport-body"><section><h2>Điều game đặt ở trung tâm</h2><p>${esc(g.lede)}</p><div class="fit-pair"><div><span>HỢP KHI BẠN MUỐN</span><p>${esc(g.fit)}</p></div><div><span>TRƯỚC KHI BẮT ĐẦU</span><p>${esc(g.caution)}</p></div></div><a class="dossier-read" href="${ru(g)}"><small>${g.readTime} PHÚT / ${g.sections.length} GÓC PHÂN TÍCH</small><h3>${esc(g.hook||g.title.split(' — ')[1])}</h3><span>Đọc bài đầy đủ →</span></a></section><aside class="passport-meta"><h2>Thông tin đối chiếu</h2>${facts(g)}<p>Nguồn gốc ghi theo studio/tác giả, không phải quốc gia nơi câu chuyện diễn ra.</p><a href="${g.source}" target="_blank" rel="noopener">Đối chiếu thông tin trên Steam ↗</a></aside></div><section class="passport-gallery"><div class="heading-line"><h2>Nhìn gần hơn</h2><span>Hình do nhà phát triển cung cấp</span></div><div class="passport-gallery-grid">${g.images.slice(0,6).map((_,i)=>mediaFigure(g,i)).join('')}</div></section>`}`;}
function reviewDetail(g){return `${crumbs([['Phòng đọc','/reviews'],[g.name]])}<header class="essay-header"><span class="eyebrow">${esc(g.theme).toUpperCase()} / ${esc(g.name)}</span><h1>${esc(g.hook||g.title.split(' — ')[1])}</h1><p>${esc(g.lede)}</p><div class="essay-meta"><a href="/authors/${g.authorSlug}">${avatar(g.author)} ${esc(g.author)}</a><span>${g.readTime} phút đọc</span><span>${g.wordCount} từ</span><button data-edit-game="${g.id}">Ghi vào sổ tay ↗</button></div></header>${mediaFigure(g,3,'essay-cover')}<div class="essay-layout"><aside class="essay-toc"><span class="eyebrow">TRONG BÀI NÀY</span><nav aria-label="Mục lục bài viết">${g.sections.map((s,i)=>`<a href="#${s.id}"><small>${i+1}</small>${esc(s.title)}</a>`).join('')}<a href="#verdict"><small>5</small>Điều còn ở lại</a><a href="#comments"><small>6</small>Sổ cảm nhận</a></nav><div class="essay-source"><strong>${esc(g.name)}</strong><span>${esc(g.country)} · ${esc(g.displayType)}</span><a href="${g.source}" target="_blank" rel="noopener">Nguồn thông tin và ảnh ↗</a><small>Phân tích biên tập minh họa. Không phải báo cáo trải nghiệm chơi trực tiếp hay điểm tổng hợp cộng đồng.</small></div></aside><article class="essay-content">${g.sections.map((s,i)=>`<section id="${s.id}" class="essay-chapter"><span class="chapter-mark">0${i+1}</span><h2>${esc(s.title)}</h2>${s.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}${i<3?mediaFigure(g,i):''}</section>`).join('')}<section id="verdict" class="essay-verdict"><span class="eyebrow">ĐIỀU CÒN Ở LẠI</span><h2>${esc(g.name)}</h2><p>${esc(g.verdict)}</p><div class="fit-pair"><div><span>ĐÁNG CHỌN VÌ</span><p>${esc(g.fit)}</p></div><div><span>CẦN CÂN NHẮC</span><p>${esc(g.caution)}</p></div></div><p class="essay-score">${Number.isFinite(g.score)?`Điểm biên tập minh họa: ${scoreText(g)}/10`:'Bài mới: chưa chấm điểm. Đọc nhận định để chọn theo sự phù hợp.'}</p></section><div class="essay-bottom-actions"><button class="outline-button" data-action="copy-link">Sao chép liên kết</button><a href="${gu(g)}">Mở hồ sơ game ↗</a></div>${comments(g)}<nav class="essay-next"><span>BÀI ĐỌC TIẾP THEO</span>${(()=>{const next=catalog.games[(g.id+1)%catalog.games.length];return `<a href="${ru(next)}"><h2>${esc(next.hook||next.title.split(' — ')[1])}</h2><strong>${esc(next.name)} →</strong></a>`;})()}</nav></article></div>`;}
function seriesCard(c,personal=false){return `<article class="series-card" style="--series-color:${c.color||'#9682b8'}"><div class="series-topline"><span>${personal?'DO BẠN SẮP':'LỘ TRÌNH BIÊN TẬP'}</span><span>${c.ids.length} game</span></div><h2><a href="/collections/${personal?'mine-'+c.id:c.slug}">${esc(c.title)}</a></h2><p>${esc(personal?c.description:c.subtitle)}</p><div class="series-spines">${c.ids.slice(0,5).map(id=>{const g=catalog.games[id];return `<a href="${gu(g)}" aria-label="Hồ sơ ${esc(g.name)}"><img src="${img(g,'library_600x900')}" alt="${esc(g.name)}" loading="lazy"></a>`;}).join('')}</div><a class="series-open" href="/collections/${personal?'mine-'+c.id:c.slug}">Mở lộ trình →</a></article>`;}
function collectionsPage(){return `${crumbs([['Chuyên đề']])}<section class="curation-intro"><span class="eyebrow">CHUYÊN ĐỀ / NHỮNG MỐI LIÊN HỆ BẤT NGỜ</span><h1>Đổi trò chơi.<br><em>Giữ một câu hỏi.</em></h1><p>Một ý tưởng có thể sống trong nhiều thế giới. Những hành trình dưới đây nối các game bằng điều chúng khiến ta suy nghĩ, với lời dẫn và góc đọc đã được biên tập sẵn.</p></section>${ideaDuets()}<section class="curation-shelf"><div class="heading-line"><h2>Hành trình có lời dẫn</h2><span>Chọn một chủ đề, mở từng thế giới</span></div><div class="series-grid">${catalog.collections.map(c=>seriesCard(c)).join('')}</div></section>`;}
function ideaDuets(){const pairs=[['Tri thức là chìa khóa','tunic','outer-wilds','Một bên giấu ngôn ngữ trong cuốn cẩm nang. Một bên để hệ mặt trời tự kể qua thời gian. Cả hai trao tiến độ bằng một khoảnh khắc hiểu ra.'],['Một căn phòng giữ một đời người','unpacking','return-of-the-obra-dinn','Sắp một món đồ vào nhà và đọc vị trí một con người trên tàu: hai cách khác nhau để nhận ra câu chuyện qua những dấu vết không nói thành lời.'],['Thất bại có gương mặt','celeste','sifu','Madeline thử lại một khoảng nhảy. Người võ sĩ đứng dậy với tuổi tác mới. Cùng một lần thua, hai cách khiến bạn nghĩ về việc tiến lên.']];const n=Math.abs(Number(qp().get('duet'))||0)%pairs.length;const [title,sa,sb,copy]=pairs[n];return `<section class="idea-duet" id="hai-the-gioi"><div class="duet-heading"><span class="eyebrow">DẤU ẤN REVIEW GAME / HAI THẾ GIỚI, MỘT Ý TƯỞNG</span><h2>${title}</h2><p>${copy}</p><nav aria-label="Chọn cặp ý tưởng">${pairs.map((p,i)=>`<a href="/collections?duet=${i}#hai-the-gioi" class="${n===i?'selected':''}">0${i+1} / ${p[0]}</a>`).join('')}</nav></div><div class="duet-pair">${[sa,sb].map(slug=>{const g=catalog.games.find(x=>x.slug===slug);return `<a href="${ru(g)}"><img src="${img(g)}" alt="${esc(g.name)}"><div><span>${esc(g.displayType)} · ${esc(g.genre)}</span><h3>${esc(g.name)}</h3><p>${esc(g.theme)}</p><b>Đọc để nối ý tưởng ↗</b></div></a>`;}).join('')}<span class="duet-connector" aria-hidden="true">✣</span></div></section>`;}
function collectionDetail(c,personal){const gs=c.ids.map(id=>catalog.games[id]).filter(Boolean);return `${crumbs([['Chuyên đề','/collections'],[c.title]])}<header class="series-detail-heading" style="--series-color:${c.color||'#9682b8'}"><span class="eyebrow">${personal?'MỘT LỘ TRÌNH DO BẠN SẮP':'LỘ TRÌNH CÓ LỜI DẪN'} / ${gs.length} ĐIỂM DỪNG</span><h1>${esc(c.title)}</h1><p>${esc(c.description)}</p><div class="button-row">${personal?`<button class="primary" data-edit-collection="${c.id}">Sửa lộ trình</button><button class="outline-button" data-delete-collection="${c.id}">Xóa lộ trình</button>`:`<a class="primary" href="${ru(gs[0])}">Bắt đầu từ bài đầu tiên ↗</a>`}<a href="/collections${personal?'?tab=mine':''}">Các lộ trình khác ↗</a></div></header>${!personal?`<blockquote class="series-angle">${esc(c.angle)}</blockquote>`:''}<ol class="series-stops">${gs.map((g,i)=>`<li><span class="stop-number">${String(i+1).padStart(2,'0')}</span><a class="stop-cover" href="${gu(g)}"><img src="${img(g)}" alt="${esc(g.name)}" loading="lazy"></a><div><span class="eyebrow">${esc(g.theme)}</span><h2><a href="${gu(g)}">${esc(g.name)}</a></h2><p>${esc(c.notes?.[i]||g.fit)}</p><a href="${ru(g)}">Đọc góc phân tích trước khi chơi ↗</a></div><button class="mini-add" data-edit-game="${g.id}" aria-label="Theo dõi ${esc(g.name)}">${state.library[g.id]?'✓':'＋'}</button></li>`).join('')}</ol>`;}
function libraryEntry(g,list=false){const e=state.library[g.id];return `<article class="notebook-entry ${list?'entry-list':''}"><a href="${gu(g)}"><img src="${img(g)}" alt="${esc(g.name)}" loading="lazy"></a><div><h3><a href="${gu(g)}">${esc(g.name)}</a></h3><span>${esc(g.country)}${e.rating!==null?' · ★ '+e.rating+'/10':''}</span><p>${e.note?esc(e.note):'Chưa viết gì ở trang này.'}</p><button data-edit-game="${g.id}">Sửa trạng thái & ghi chú ↗</button></div></article>`;}
function libraryPage(){const p=qp(),q=(p.get('q')||'').toLocaleLowerCase('vi'),selected=p.get('status'),list=p.get('view')==='list';let gs=catalog.games.filter(g=>state.library[g.id]&&`${g.name} ${state.library[g.id].note}`.toLocaleLowerCase('vi').includes(q));if(selected)gs=gs.filter(g=>state.library[g.id].status===selected);gs.sort(p.get('sort')==='name'?(a,b)=>a.name.localeCompare(b.name):(a,b)=>state.library[b.id].updated.localeCompare(state.library[a.id].updated));return `${crumbs([['Sổ tay chơi game']])}${folio('MỘT CHỖ CHO NHỮNG ĐIỀU MUỐN NHỚ','Chơi tới đâu,<br><em>viết tới đó.</em>','Giữ lý do muốn chơi, ghi lại điều đang mắc và để một game tạm nghỉ mà không mất dấu.',`<div class="notebook-total"><strong>${Object.keys(state.library).length}</strong><span>trang sổ đang có</span><button data-action="export-library">Xuất sổ tay ↓</button></div>`)}<div class="notebook-toolbar"><form data-form="library-search"><input type="search" name="q" value="${esc(p.get('q')||'')}" aria-label="Tìm trong sổ tay" placeholder="Tên game hoặc một ghi chú…"><select name="sort" aria-label="Sắp xếp sổ tay"><option value="recent">Mới ghi gần đây</option><option value="name" ${p.get('sort')==='name'?'selected':''}>Tên A–Z</option></select><button class="outline-button">Tìm</button></form><div><button data-query="view" data-value="board" class="${list?'':'selected'}">Bảng hành trình</button><button data-query="view" data-value="list" class="${list?'selected':''}">Danh sách</button></div></div><nav class="notebook-tabs"><a href="/library" class="${!selected?'selected':''}">Tất cả</a>${Object.entries(labels).map(([key,name])=>`<a href="/library?status=${key}" class="${selected===key?'selected':''}">${name} <small>${Object.values(state.library).filter(e=>e.status===key).length}</small></a>`).join('')}</nav>${list?`<div class="notebook-list">${gs.map(g=>libraryEntry(g,true)).join('')||empty('Chưa có trang nào khớp','Lưu một game hoặc tìm bằng ghi chú khác.','/games','Mở Atlas')}</div>`:`<div class="journey-board">${Object.entries(labels).filter(([key])=>!selected||selected===key).map(([key,name])=>{const entries=gs.filter(g=>state.library[g.id].status===key);return `<section class="journey-column" data-status="${key}"><header><span class="status-dot"></span><h2>${name}</h2><b>${entries.length}</b></header>${entries.map(g=>libraryEntry(g)).join('')||`<div class="column-empty"><span>＋</span><p>${({wishlist:'Một ý tưởng cho buổi chơi tới.',playing:'Trang này chờ game bạn đang đi cùng.',completed:'Điều đã qua vẫn đáng giữ lại.',paused:'Tạm nghỉ cũng là một trạng thái.'})[key]}</p><a href="/games">Chọn một hồ sơ ↗</a></div>`}</section>`;}).join('')}</div>`}<div class="notebook-tip"><span>GHI CHÚ NHỎ</span><p>“Lần tới thử đường bên trái” có ích hơn một điểm số nếu nó giúp bạn quay lại đúng điều đang tò mò.</p><a href="/collections?tab=mine">Lộ trình của bạn ↗</a></div>`;}
function profilePage(){const p=state.profile,tab=qp().get('tab')||'activity',completed=catalog.games.filter(g=>state.library[g.id]?.status==='completed');return `${crumbs([['Trang của bạn']])}<section class="writer-profile"><div class="profile-monogram">${avatar(p.name,'profile-avatar')}</div><div><span class="eyebrow">NGƯỜI GIỮ CUỐN SỔ NÀY</span><h1>${esc(p.name)}</h1><p>${esc(p.bio)}</p><span>Thường tò mò về ${esc(p.favorite.toLowerCase())}</span></div><a class="outline-button" href="/settings">Sửa đôi dòng giới thiệu ↗</a></section><div class="profile-ledger"><div><strong>${completed.length}</strong><span>hành trình đã khép</span></div><div><strong>${state.comments.length}</strong><span>cảm nhận đã viết</span></div><div><strong>${state.collections.length}</strong><span>lộ trình tự sắp</span></div></div><nav class="series-tabs">${[['activity','Dấu mốc gần đây'],['comments','Những điều đã viết'],['collections','Lộ trình của tôi']].map(([key,name])=>`<a href="/profile${key==='activity'?'':'?tab='+key}" class="${tab===key?'selected':''}">${name}</a>`).join('')}</nav>${tab==='collections'?`<div class="series-grid">${state.collections.map(c=>seriesCard(c,true)).join('')||empty('Chưa sắp một lộ trình','Mỗi đường đi có thể bắt đầu từ một câu hỏi.','/collections','Tới bàn sắp game')}</div>`:tab==='comments'?`<div class="personal-writing">${state.comments.map(c=>{const g=catalog.games[c.gameId];return `<article><a href="${ru(g)}">${esc(g.name)} ↗</a><time>${new Date(c.date).toLocaleDateString('vi-VN')}</time>${c.spoiler?`<details><summary>Đọc cảm nhận có tiết lộ</summary><p>${esc(c.content)}</p></details>`:`<p>${esc(c.content)}</p>`}</article>`;}).join('')||empty('Bạn chưa viết một cảm nhận','Đọc một bài rồi giữ lại một điều của riêng mình.','/reviews','Vào phòng đọc')}</div>`:`<section class="personal-timeline"><h2>Những lần bạn đã quay lại</h2>${state.activity.map(a=>`<article><time>${new Date(a.date).toLocaleString('vi-VN')}</time><p>${esc(a.message)}</p></article>`).join('')||'<p class="timeline-empty">Chưa có dấu mốc. Một trang sổ đầu tiên sẽ mở câu chuyện ở đây.</p>'}</section>`}`;}
function settingsPage(){return `${crumbs([['Trang của bạn','/profile'],['Tùy chỉnh sổ tay']])}${folio('MỘT CUỐN SỔ, MỘT GIỌNG RIÊNG','Bạn muốn được<br><em>gọi thế nào?</em>','Đổi tên và vài dòng giới thiệu. Dữ liệu này thuộc phiên trình duyệt hiện tại.')}<div class="preferences-layout"><form data-form="profile" class="stack-form preference-form"><label>Tên trên bìa sổ<input name="name" required maxlength="40" value="${esc(state.profile.name)}"></label><label>Một đôi dòng về cách bạn chơi<textarea name="bio" maxlength="300">${esc(state.profile.bio)}</textarea></label><label>Điều thường khiến bạn tò mò<select name="favorite">${['Phiêu lưu','Hành động','Cozy','Giải đố','RPG','Roguelike'].map(v=>`<option ${state.profile.favorite===v?'selected':''}>${v}</option>`).join('')}</select></label><button class="primary">Lưu bìa sổ ✓</button><p class="form-feedback" role="status"></p></form><aside class="preference-notes"><h2>Giữ dữ liệu mang theo</h2><p>Xuất một bản JSON của thư viện và các lộ trình. Bản cục bộ chưa có tài khoản đồng bộ giữa thiết bị.</p><button class="outline-button" data-action="export-library">Tải bản sao ↓</button><h2>Màn mở đầu</h2><p>Logo xuất hiện một lần trong phiên, để các lần quay lại đi thẳng vào nội dung.</p><button class="outline-button" data-action="replay-intro">Xem lại logo ✺</button><a href="/privacy">Cách dữ liệu được lưu ↗</a></aside></div>`;}
function searchPage(){const q=(qp().get('q')||'').trim(),t=q.toLocaleLowerCase('vi'),gs=q?catalog.games.filter(g=>`${g.name} ${g.theme} ${g.country} ${g.developer} ${g.genre}`.toLocaleLowerCase('vi').includes(t)):[],fs=q?catalog.features.filter(f=>`${f.title} ${f.subtitle}`.toLocaleLowerCase('vi').includes(t)):[];return `${crumbs([['Tra cứu']])}${folio('MỘT TỪ KHÓA, NHIỀU LỐI ĐỌC','Bạn muốn<br><em>tìm hiểu điều gì?</em>','Tên một studio, một quốc gia, một cơ chế hoặc một tựa đang ở trong đầu.')}<form data-form="search" class="lookup-form"><input type="search" name="q" required value="${esc(q)}" aria-label="Từ khóa tra cứu" placeholder="Thử parry, Indonesia hoặc Baba…"><button class="primary">Tra cứu →</button></form>${q?`<div class="index-result"><p>${gs.length+fs.length} kết quả cho “${esc(q)}”</p></div><div class="lookup-results">${gs.map(g=>`<article><span>HỒ SƠ GAME</span><h2><a href="${gu(g)}">${esc(g.name)} →</a></h2><p>${esc(g.theme)} · ${esc(g.country)} · ${esc(g.developer)}</p><a href="${ru(g)}">Bài phân tích: ${esc(g.hook||g.title.split(' — ')[1])}</a></article>`).join('')}${fs.map(f=>`<article><span>BÀN VỀ THIẾT KẾ</span><h2><a href="/features/${f.slug}">${esc(f.title)} →</a></h2><p>${esc(f.subtitle)}</p></article>`).join('')||''}</div>${gs.length+fs.length?'':empty('Từ này chưa có trong chỉ mục','Thử một tên ngắn hơn hoặc một thể loại.','/search','Tra lại')}`:`<div class="lookup-hints"><span>MỘT VÀI HƯỚNG ĐỂ HỎI</span>${['Lựa chọn','Thẻ bài','Indonesia','Phần Lan','Giải đố','Kinh dị'].map(v=>`<a href="/search?q=${encodeURIComponent(v)}">${v} ↗</a>`).join('')}</div>`}`;}
function authorsPage(a){const notes={'minh-hoang':['Đọc một cuộc đấu như một cuộc đối thoại','Chú ý tín hiệu, khoảng cách và phần phải học lại. Độ khó chỉ có ích để mô tả khi biết rõ nó đòi điều gì.'],'an-nhien':['Giữ những điều nhỏ có địa chỉ','Một người dân, một quầy bar hoặc một món đồ có thể nói nhiều về thế giới. Không dùng một nhãn ấm áp để thay cho việc nhìn kỹ.'],'khanh-linh':['Bảo vệ một lần hiểu ra','Giải thích vì sao câu đố có ý nghĩa, giữ lời giải cho người chơi. Một bí mật không cần bị kể hết để được phân tích.']};if(a){const gs=catalog.games.filter(g=>g.authorSlug===a.slug);return `${crumbs([['Bàn biên tập','/authors'],[a.name]])}<section class="editor-desk">${avatar(a.name,'profile-avatar')}<div><span class="eyebrow">BÚT DANH BIÊN TẬP / ${esc(a.role)}</span><h1>${esc(a.name)}</h1><h2>${notes[a.slug][0]}</h2><p>${notes[a.slug][1]}</p></div></section><div class="editor-reading-list"><h2>Những câu hỏi đang theo đuổi</h2>${gs.map((g,i)=>readingRow(g,i)).join('')}</div>`;}return `${crumbs([['Bàn biên tập']])}${folio('BA GIỌNG, BA CÁCH ĐẶT CÂU HỎI','Ai đang viết<br><em>những dòng này?</em>','Các bút danh dùng để tổ chức nội dung mẫu. Không giả lập một đội ngũ đã chơi và nhận bản review.')}<div class="editor-desks">${catalog.authors.map((a,i)=>`<article style="--desk-color:${a.color}"><span class="desk-index">0${i+1}</span>${avatar(a.name,'large')}<span class="eyebrow">${esc(a.role)}</span><h2><a href="/authors/${a.slug}">${esc(a.name)}</a></h2><h3>${notes[a.slug][0]}</h3><p>${notes[a.slug][1]}</p><a href="/authors/${a.slug}">Mở bàn viết →</a></article>`).join('')}</div>`;}
function featureCardV4(f,i=0){const g=catalog.games[f.game];return `<article class="journal-card"><a class="journal-card-photo" href="/features/${f.slug}"><img src="${esc(g.images[0]?.src||img(g))}" data-app="${g.app}" alt="${esc(g.name)} · hình minh họa bài viết" loading="lazy"><span>${esc(f.category)}</span></a><div class="journal-card-copy"><span class="eyebrow">${esc(g.name)} / THIẾT KẾ & CẢM NHẬN</span><h2><a href="/features/${f.slug}">${esc(f.title)}</a></h2><p>${esc(f.subtitle)}</p><a class="journal-read" href="/features/${f.slug}">Mở bài viết <span>↗</span></a></div></article>`;}
function chooseCandidates(){const p=qp(),intent=p.get('intent')||'cozy',patterns={cozy:/Cozy|Nghệ thuật|Khám phá/,story:/Cốt truyện|RPG|Visual novel/,puzzle:/Giải đố|Logic|Điều tra/,challenge:/Hành động|Boss rush|Platformer|Metroidvania/,strategy:/Quản lý|Chiến thuật|Thẻ bài|Xây dựng/};return catalog.games.filter(g=>patterns[intent]?.test(g.genre)&&(!p.get('space')||g.type===p.get('space'))&&(!p.get('company')||g.mode.includes('Co-op')));}
function gameFinder(){const p=qp(),gs=chooseCandidates(),wave=Math.max(0,Number(p.get('wave'))||0),start=gs.length?(wave*3)%gs.length:0,chosen=gs.slice(start,start+3).concat(gs.slice(0,Math.max(0,start+3-gs.length))).slice(0,Math.min(3,gs.length)),next=new URLSearchParams(p);next.set('wave',wave+1);return `<section class="play-finder" id="chon-game"><div class="finder-copy"><span class="eyebrow">CHỌN THEO ĐIỀU BẠN MUỐN LÀM</span><h2>Buổi chơi này,<br>bạn muốn điều gì?</h2><p>Chọn nhịp trải nghiệm, không gian hình ảnh và cách chơi. Mỗi gợi ý có lý do phù hợp cùng điều cần cân nhắc.</p></div><form data-form="game-finder" class="finder-form"><label>Tôi muốn<select name="intent">${[['cozy','Đi chậm, ngắm và khám phá'],['story','Theo một câu chuyện'],['puzzle','Suy luận và giải câu đố'],['challenge','Thử phản xạ, vượt thử thách'],['strategy','Xây dựng hoặc tính chiến thuật']].map(([v,t])=>`<option value="${v}" ${(p.get('intent')||'cozy')===v?'selected':''}>${t}</option>`).join('')}</select></label><label>Không gian hình ảnh<select name="space">${[['','Cả 2D và 3D'],['2D','2D'],['3D','3D']].map(([v,t])=>`<option value="${v}" ${p.get('space')===v?'selected':''}>${t}</option>`).join('')}</select></label><label>Tôi sẽ chơi<select name="company"><option value="">Một mình / không giới hạn</option><option value="coop" ${p.get('company')==='coop'?'selected':''}>Cùng bạn (Co-op)</option></select></label><button type="submit" class="primary">Tìm game cho tôi →</button></form></section><div class="finder-result-heading"><h2>${gs.length?chosen.length+' điểm bắt đầu để cân nhắc':'Chưa có lựa chọn khớp cả ba điều'}</h2><span>${gs.length} game phù hợp</span>${gs.length>3?`<a href="/features?${esc(next.toString())}#goi-y">Đổi ba gợi ý ↻</a>`:''}</div><div class="finder-results" id="goi-y">${chosen.map(g=>`<article><a href="${gu(g)}"><img src="${img(g)}" alt="${esc(g.name)}" loading="lazy"></a><div class="finder-result-copy"><span>${esc(g.country)} · ${esc(g.displayType)}</span><h3><a href="${gu(g)}">${esc(g.name)}</a></h3><h4>Hợp vì</h4><p>${esc(g.fit)}</p><h4>Cần cân nhắc</h4><p>${esc(g.caution)}</p><div><a href="${gu(g)}">Mở hồ sơ ↗</a><button data-edit-game="${g.id}">Ghi vào sổ tay ＋</button></div></div></article>`).join('')||'<p>Thử bỏ giới hạn 2D/3D hoặc chọn cách chơi khác. Danh mục không gán Co-op cho game chơi đơn.</p>'}</div>`;}
function comparisonDesk(){const p=qp(),a=catalog.games.find(g=>g.slug===p.get('first'))||catalog.games[7],b=catalog.games.find(g=>g.slug===p.get('second'))||catalog.games[6],opts=g=>catalog.games.map(x=>`<option value="${x.slug}" ${x.id===g.id?'selected':''}>${esc(x.name)}</option>`).join('');return `<section class="comparison-desk"><span class="eyebrow">ĐẶT HAI TRẢI NGHIỆM CẠNH NHAU</span><h2>Khác nhau ở đâu trước khi bạn chọn?</h2><form data-form="game-compare"><label>Game thứ nhất<select name="first">${opts(a)}</select></label><label>Game thứ hai<select name="second">${opts(b)}</select></label><button class="primary" type="submit">So sánh →</button></form><div class="comparison-pair">${[a,b].map(g=>`<article><img src="${img(g)}" alt="${esc(g.name)}"><h3>${esc(g.name)}</h3><p class="compare-genre">${esc(g.genre)} · ${esc(g.mode)}</p><h4>Điều đặt ở trung tâm</h4><p>${esc(g.theme)}</p><h4>Hợp khi bạn muốn</h4><p>${esc(g.fit)}</p><h4>Điểm cần cân nhắc</h4><p>${esc(g.caution)}</p><a class="outline-button" href="${ru(g)}">Đọc phân tích ↗</a></article>`).join('')}</div>${a.id===b.id?'<p class="comparison-hint">Bạn đang chọn cùng một game. Chọn một tựa khác để thấy sự khác biệt.</p>':''}</section>`;}
function featuresPage(f){if(!f)return indieHubV5();const g=catalog.games[f.game],words=f.sections.flatMap(s=>s.slice(1)).join(' ').split(/\s+/).length;return `${crumbs([['Chuyện ngoài màn hình','/features#tu-bai-viet'],[g.name]])}<header class="feature-masthead"><div><span class="eyebrow">${esc(f.category)} / ${esc(g.name)}</span><h1>${esc(f.title)}</h1><p>${esc(f.subtitle)}</p><div class="essay-meta"><span>Bàn biên tập Review Game</span><span>${Math.ceil(words/200)} phút đọc</span><span>${f.sections.length} chương</span><button data-action="copy-link">Sao chép liên kết ↗</button></div></div><a class="feature-masthead-image" href="#feature-chapter-1"><img src="${esc(assetUrl(g.images[0]?.src)||img(g,'library_hero'))}" data-app="${g.app}" alt="${esc(g.name)} · hình do nhà phát triển cung cấp"><span>Đọc câu chuyện ↓</span></a></header><div class="essay-layout feature-article"><aside class="essay-toc"><span class="eyebrow">THEO DÒNG BÀI VIẾT</span><nav aria-label="Mục lục câu chuyện">${f.sections.map(([title],i)=>`<a href="#feature-chapter-${i+1}"><b>${String(i+1).padStart(2,'0')}</b><span>${esc(title)}</span></a>`).join('')}</nav><div class="feature-source-note"><strong>${esc(g.name)}</strong><p>Nội dung biên tập minh họa, ảnh từ nguồn chính thức. Không tiết lộ các nút thắt chính.</p><a href="${g.source}" target="_blank" rel="noopener">Đối chiếu nguồn ↗</a></div></aside><article class="essay-content">${f.sections.map(([title,...paragraphs],i)=>`<section class="essay-chapter" id="feature-chapter-${i+1}"><span class="chapter-mark">${String(i+1).padStart(2,'0')} / ${esc(g.name)}</span><h2>${esc(title)}</h2>${paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}${i<3?mediaFigure(g,i,'feature-scene'):''}</section>`).join('')}<section class="feature-takeaway"><span class="eyebrow">MANG Ý TƯỞNG NÀY VÀO BUỔI CHƠI</span><h2>${esc(f.takeawayTitle||'Một chi tiết để nhìn lại')}</h2><p>${esc(f.takeaway||g.fit)}</p><div class="button-row"><a class="primary" href="${gu(g)}">Mở hồ sơ ${esc(g.name)} ↗</a><button class="outline-button" data-edit-game="${g.id}">Ghi một điều muốn thử ＋</button></div></section><div class="essay-bottom-actions"><a href="/features#tu-bai-viet">← Tủ bài viết</a><a href="/features">Tìm game cho buổi tới →</a></div></article></div>`;}
function aboutPage(){return `${crumbs([['Về Review Game']])}${folio('MỘT WEBSITE CHO VIỆC NHÌN KỸ HƠN','Ý tưởng nhỏ.<br><em>Dư âm không nhỏ.</em>','Review Game được xây quanh ba hành động khác nhau: tìm một game, hiểu điều nó làm và giữ lại điều của riêng bạn.')}<div class="about-editorial"><span class="about-large-mark">✺</span><article><h2>Một trang giới thiệu không đủ để gọi là một website.</h2><p>Trang Khám phá là lời mời đầu tiên. Atlas có nhiệm vụ tổ chức hồ sơ, Phòng đọc dành chỗ cho phân tích, còn Sổ tay ghi những lựa chọn của người chơi. Chúng dùng cùng một danh mục, nhưng không nên kể lại cùng một đoạn giới thiệu.</p><p>100 game ở đây gồm 42 tựa đã có và 58 hồ sơ bổ sung. Nội dung đi theo bản sắc của từng tác phẩm: không gán cốt truyện cho game không có cốt truyện tuyến tính, không dùng độ khó như một lời khen chung, không lấy ảnh bìa làm bằng chứng cho toàn bộ trải nghiệm.</p><h2>Giọng viết cần một điều cụ thể để bám.</h2><p>Cách dẫn của Indie Hive và Checkpoint gợi một nguyên tắc hữu ích: bắt đầu từ tình huống, sau đó giải thích điều làm tình huống ấy có ý nghĩa. Nội dung ở đây được viết mới bằng tiếng Việt, không chép caption hay review của nguồn tham khảo.</p><h2>Những điều được ghi đúng tên.</h2><p>Bài viết và bút danh là nội dung biên tập minh họa. Ảnh có nguồn nhà phát triển/Steam, không được trình bày như ảnh tự chụp. Điểm cũ giữ nguyên và ghi rõ minh họa; các bài mới chưa chấm điểm. Quốc gia chỉ nguồn gốc studio hoặc tác giả, không phải nơi câu chuyện diễn ra.</p><p>Thư viện, cảm nhận và hồ sơ có lưu ở máy chạy website. Chưa có đăng nhập đồng bộ hoặc gửi email ngoài máy. Giới hạn này được nói ngay tại nơi dùng chức năng.</p><div class="about-reference-links"><a href="https://indie-hive.com/category/reviews/" target="_blank" rel="noopener">Indie Hive ↗</a><a href="https://checkpointgaming.net/reviews/" target="_blank" rel="noopener">Checkpoint Gaming ↗</a><a href="https://infinitebacklog.net" target="_blank" rel="noopener">Infinite Backlog ↗</a></div><small>Infinite Backlog không cung cấp nội dung đọc được khi khảo sát, nên đối chiếu copy của nguồn này chưa đầy đủ.</small></article></div>`;}
function contactPage(){return `${crumbs([['Hộp góp ý']])}${folio('MỘT GÓP Ý CẦN ĐỦ NGỮ CẢNH','Bạn vừa thấy<br><em>điều gì chưa ổn?</em>','Tên game, phần bài hoặc một thao tác cụ thể sẽ giúp lời nhắn rõ hơn. Bạn cũng có thể đề xuất studio chưa có trong Atlas.')}<div class="letter-layout"><aside><span class="eyebrow">TRƯỚC KHI VIẾT</span><h2>Cho lời nhắn một điểm bám.</h2><ol><li>Game hoặc đường dẫn bạn đang xem.</li><li>Điều đang xảy ra và điều bạn mong thấy.</li><li>Một nguồn chính thức nếu đề nghị sửa thông tin.</li></ol><p>Form chỉ lưu trên máy chạy bản này. Chưa chuyển lời nhắn tới email hay một đội tiếp nhận bên ngoài.</p></aside><form class="stack-form letter-form" data-form="contact"><label>Cách gọi bạn<input name="name" required maxlength="80" placeholder="Tên hoặc bút danh"></label><label>Email đi kèm lời nhắn<input name="email" type="email" required maxlength="254" placeholder="ban@example.com"></label><label>Lời nhắn thuộc phần nào?<select name="topic">${['Thông tin một game','Nội dung bài phân tích','Giao diện và thao tác','Đề xuất studio / game','Dữ liệu cá nhân'].map(v=>`<option>${v}</option>`).join('')}</select></label><label>Điều bạn muốn nói<textarea name="message" required minlength="10" maxlength="3000" placeholder="Bắt đầu từ một chi tiết cụ thể…"></textarea></label><button type="submit" class="primary">Lưu vào hộp góp ý →</button><p class="form-feedback" role="status"></p></form></div>`;}
function infoPage(kind){if(kind==='faq'){const faqs=[['Sổ tay có giữ sau khi tải lại?','Có. Máy chủ lưu hồ sơ, trạng thái, ghi chú, cảm nhận và lộ trình trong dữ liệu cục bộ. Cookie nhận diện phiên để trình duyệt quay lại đúng cuốn sổ.'],['Vì sao các game mới không có điểm?','Các hồ sơ mới có phân tích nhưng chưa chấm. Điểm của 12 game cũ được giữ và ghi là biên tập minh họa; không lấy điểm từ Steam để giả làm review của Review Game.'],['Quốc gia trong Atlas có ý nghĩa gì?','Nguồn gốc của studio hoặc tác giả. Một nhóm có thể liên quan nhiều nơi; điều này không đồng nghĩa bối cảnh của câu chuyện nằm ở quốc gia đó.'],['Tôi sửa trạng thái và ghi chú ở đâu?','Mở một hồ sơ game, chọn Bắt đầu theo dõi hoặc Sửa sổ tay. Có thể đổi trạng thái, điểm cá nhân và ghi chú. Từ bảng hành trình cũng có nút sửa ở từng mục.'],['Có chia sẻ công khai và đồng bộ không?','Chưa. Cảm nhận là của phiên cá nhân, hồ sơ không phải tài khoản đăng nhập. Các chức năng cộng đồng công khai và đồng bộ nhiều thiết bị chưa kết nối.'],['Làm sao xem lại màn logo?','Vào Tùy chỉnh sổ tay từ trang hồ sơ, rồi chọn Xem lại logo. Màn mở đầu bình thường chỉ hiện một lần trong phiên và có nút bỏ qua.'],['Chuyển động có thể giảm không?','Website tôn trọng tùy chọn giảm chuyển động của hệ điều hành/trình duyệt. Nội dung vẫn hiện đầy đủ và thao tác không phụ thuộc animation.'],['Ảnh và lời nhắn dùng dịch vụ nào?','Ảnh được tải từ nguồn Steam. Form góp ý và bản tin cũ chỉ lưu ở máy chạy website, chưa gửi email. Font ngoài có phông hệ thống dự phòng.']];return `${crumbs([['Hướng dẫn sử dụng']])}${folio('NHỮNG ĐIỀU CẦN BIẾT TRƯỚC KHI QUAY LẠI','Một vài câu hỏi,<br><em>trả lời thẳng.</em>','Thông tin về nội dung, sổ tay và giới hạn của bản cục bộ.')}<div class="help-accordion">${faqs.map(([q,a],i)=>`<details><summary><span>${String(i+1).padStart(2,'0')}</span>${q}<b>＋</b></summary><p>${a}</p></details>`).join('')}</div>`;}const privacy=kind==='privacy';const sections=privacy?[['Cuốn sổ gắn với một phiên','Dữ liệu ở máy chạy website: tên, giới thiệu, trạng thái game, điểm cá nhân, ghi chú, cảm nhận và lộ trình. Cookie iv_session giúp quay lại đúng phiên, có HttpOnly và SameSite=Lax. Không có tài khoản cloud trong bản này.'],['Xóa cookie không xóa dữ liệu trên máy chủ','Trình duyệt mất khóa nhận diện và mở một hồ sơ mới; dữ liệu cũ vẫn ở máy chạy website. Đừng xem việc xóa cookie là một chức năng xóa tài khoản. Có thể sửa hoặc bỏ từng mục của mình qua giao diện.'],['Nguồn tải bên ngoài','Ảnh kết nối tới Steam CDN, font tới Google Fonts. Không tích hợp quảng cáo hoặc phân tích lượt truy cập. Khi font không tải được, chữ dùng phông hệ thống.'],['Lời nhắn chưa rời máy này','Form góp ý và đăng ký bản tin lưu dữ liệu trên máy chạy bản cục bộ. Không gửi email, không đăng công khai.'],['Một bản sao để giữ','Có thể xuất thư viện và các lộ trình từ Sổ tay hoặc Tùy chỉnh. Tệp JSON giúp giữ một bản đọc được; hiện chưa có chức năng nhập và đồng bộ.']]:[['Bài viết bắt đầu từ một ý tưởng','Mỗi bài cần nói cụ thể game yêu cầu người chơi làm gì, cách câu chuyện hoặc hệ thống hỗ trợ ý tưởng đó và giới hạn nào ảnh hưởng trải nghiệm. Không dùng một đoạn khen chung để thay cho phân tích.'],['Điểm không được làm thay việc đọc','12 điểm cũ là dữ liệu minh họa được giữ nguyên. Các bài bổ sung chưa chấm điểm; việc không có số không làm mất phần nhận định. Điểm cá nhân trong sổ tay là dữ liệu khác, không thay đổi điểm biên tập.'],['Không giả lập một lần chơi trực tiếp','Các bài là nội dung biên tập minh họa dựa trên thông tin game và phân tích thiết kế. Bút danh không phải lời xác nhận đã chơi, nhận bản review hoặc kiểm tra hiệu năng trên thiết bị thật.'],['Giữ những phát hiện thuộc người chơi','Bài viết bàn tiền đề và cơ chế mà tránh kể các nút thắt lớn hoặc lời giải. Cảm nhận cá nhân có tùy chọn đánh dấu tiết lộ nội dung để người đọc chủ động mở.'],['Nguồn cần đúng loại thông tin','Thông tin và ảnh game dẫn nguồn Steam/nhà phát triển. Quốc gia là nguồn gốc studio/tác giả, không phải nơi câu chuyện diễn ra. Nhận định về thiết kế là góc phân tích, không phải thống kê đánh giá cộng đồng.']];return `${crumbs([[privacy?'Dữ liệu & quyền riêng tư':'Nguyên tắc biên tập']])}${folio(privacy?'GIỮ ĐÚNG GIỚI HẠN':'GHI ĐÚNG LOẠI NHẬN ĐỊNH',privacy?'Cuốn sổ này<br><em>được giữ ở đâu?</em>':'Một con số<br><em>không đủ kể hết.</em>',privacy?'Thông tin cho bản website chạy tại máy của bạn.':'Cách đọc bài phân tích và phân biệt nguồn với nội dung minh họa.')}<article class="policy-document">${sections.map(([title,text],i)=>`<section><span>${String(i+1).padStart(2,'0')}</span><div><h2>${title}</h2><p>${text}</p></div></section>`).join('')}</article>`;}
function notFound(){return `<section class="lost-page"><span>404 / NGOÀI CHỈ MỤC</span><h1>Chưa có trang<br>ở đường này.</h1><p>URL có thể đã thay đổi hoặc hồ sơ chưa được tạo. Mở lại chỉ mục để chọn một đường có nội dung.</p><a class="primary" href="/games">Về Atlas →</a></section>`;}

function homeFeatureBySlug(slug){return featureCardV4([...catalog.legacyFeatures,...catalog.features].find(f=>f.slug===slug));}

</script>
<script>
/* Module: indie-hub.js */
function indieHubV5(){
 const p=qp(),mode=p.get('mode')||(p.has('intent')?'finder':null),stories=[...catalog.legacyFeatures,...catalog.features],find=slug=>stories.find(f=>f.slug===slug),cover=g=>esc(g.images[0]?.src||img(g,'library_hero'));
 const nav=`<nav class="indie-nav" aria-label="Các phần Góc indie"><a class="${!mode?'selected':''}" href="/features">Giải mã ý tưởng</a><a class="${mode==='finder'?'selected':''}" href="/features?mode=finder#chon-game">Tìm game hợp với tôi</a><a class="${mode==='compare'?'selected':''}" href="/features?mode=compare">So sánh hai game</a><a href="/features#tu-bai-viet">Tủ bài viết ↓</a></nav>`;
 if(mode==='compare'||mode==='finder'||p.has('intent'))return `${crumbs([['Góc indie','/features'],[mode==='compare'?'Bàn so sánh':'Chọn một buổi chơi']])}${nav}${mode==='compare'?comparisonDesk():gameFinder()}<a class="indie-return" href="/features">← Trở về những ý tưởng đáng khám phá</a>`;
 const lead=find('ban-do-khong-phai-checklist'),g=catalog.games[lead.game];

p(([slug,title,copy,task],i)=>{const x=catalog.games.find(g=>g.slug===slug);return `<article class="idea-case"><a class="idea-case-photo" href="${gu(x)}"><img src="${cover(x)}" data-app="${x.app}" alt="${esc(x.name)}" loading="lazy"><span>0${i+1}</span></a><div class="idea-case-copy"><span class="eyebrow">${esc(x.name)}</span><h3>${title}</h3><p>${copy}</p><div class="idea-task"><span>THỬ QUAN SÁT</span><p>${task}</p></div><div class="idea-case-actions"><a href="${ru(x)}">Đọc góc phân tích ↗</a><button data-edit-game="${x.id}" aria-label="Ghi câu hỏi về ${esc(x.name)} vào sổ tay">Mở sổ tay ＋</button></div></div></article>`;}).join('')}</div></section><section class="journal-shelf" id="tu-bai-viet"><div class="journal-shelf-heading"><span class="eyebrow">ĐỌC SÂU / CHUYỆN NGOÀI MÀN HÌNH</span><h2>Ở lại với một trò chơi.</h2><p>Sáu hồ sơ, sáu câu hỏi riêng. Mỗi bài đi từ một cảnh hoặc một cơ chế tới điều làm trải nghiệm ấy có ý nghĩa.</p></div><div class="journal-grid">${stories.map(featureCardV4).join('')}</div></section><section class="indie-tools-callout"><div><span class="eyebrow">TỪ Ý TƯỞNG ĐẾN BUỔI CHƠI</span><h2>Đã có một điều muốn thử?</h2><p>Chọn game theo nhịp mình muốn, hoặc đặt hai trải nghiệm cạnh nhau trước khi bắt đầu.</p></div><div><a class="primary" href="/features?mode=finder#chon-game">Tìm game cho tôi →</a><a class="outline-button" href="/features?mode=compare">So sánh hai game ↗</a></div></section>`;

    ['dead-cells',[3,1,5,0,3,2,0,5],45,'intense','high','combat',false,'Vũ khí thay đổi nhịp tấn công; lượt chơi cần phản xạ liên tục.'],

    ['return-of-the-obra-dinn',[4,5,3,0,0,3,0,4],45,'curious','high','puzzle',false,'Quan sát hiện trường và xác định danh tính; cần ghi nhớ nhiều người.'],

    ['sanabi',[3,5,4,0,0,2,0,4],30,'intense','high','combat',false,'Móc kéo biến di chuyển thành chuỗi hành động xuyên thành phố.'],

  ];
  const profiles=Object.fromEntries(rows.map(([slug,vector,minutes,mood,energy,activity,coop,reason])=>[slug,{slug,vector,minutes,mood,energy,activity,coop,reason}]));
  const visualStyles={
    'a-short-hike':['low-poly','pastel','nature'],'stardew-valley':['pixel','warm','nature'],'core-keeper':['pixel','warm','underground'],'outer-wilds':['low-poly','space','warm'],'tunic':['low-poly','pastel','fantasy'],'hollow-knight':['hand-drawn','dark','fantasy'],'celeste':['pixel','pastel','mountain'],'hades':['hand-drawn','high-contrast','fantasy'],'dead-cells':['pixel','dark','fantasy'],'nine-sols':['hand-drawn','dark','fantasy'],'coffee-talk':['pixel','warm','urban'],'a-space-for-the-unbound':['pixel','warm','urban'],'gris':['hand-drawn','pastel','nature'],'hoa':['hand-drawn','pastel','nature'],'baba-is-you':['pixel','minimal'],'cocoon':['low-poly','minimal','fantasy'],'return-of-the-obra-dinn':['monochrome','high-contrast','minimal'],'slay-the-spire':['hand-drawn','fantasy'],'balatro':['pixel','high-contrast'],'noita':['pixel','dark','fantasy'],'dredge':['low-poly','dark','nature'],'sifu':['low-poly','urban','high-contrast'],'sanabi':['pixel','urban','high-contrast'],'broforce':['pixel','urban','high-contrast']

  function recommend({minutes=60,mood='',energy='',activity='',coop='',like='',positive=0,avoid=-1}={}){
    return Object.values(profiles).filter(p=>p.slug!==like&&p.minutes<=Number(minutes)&&(!coop||coop!=='yes'||p.coop)).map(p=>{
      let score=(p.mood===mood?4:0)+(p.energy===energy?4:0)+(p.activity===activity?5:0);
      if(like&&profiles[like])score+=5-Math.abs(p.vector[positive]-profiles[like].vector[positive]);
      if(Number(avoid)>=0)score-=p.vector[Number(avoid)]*2;
      return {...p,score};
    }).sort((a,b)=>b.score-a.score||a.slug.localeCompare(b.slug));

  function dna(library={},journal=[],dropped={}){

      const w=(e.status==='wishlist'?.25:e.status==='completed'?2:1)*(e.rating==null?1:Math.max(.1,Number(e.rating)/5))*(1+Math.min(hours,50)/50);
      const dropAxis={grind:4,difficulty:2,easy:2,story:1};
      p.vector.forEach((v,i)=>{let value=v;const reason=dropped[slug]?.reason;if(dropAxis[reason]===i)value=reason==='easy'?5:Math.max(0,v-2);const favorites=journal.filter(j=>j.slug===slug&&j.focus!==undefined&&j.focus!==''&&Number(j.focus)===i).length;if(favorites)value=Math.min(5,value+Math.min(2,favorites));sums[i]+=value*w;weights[i]+=w;});evidence++;
    }
